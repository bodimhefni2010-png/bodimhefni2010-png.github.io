function setLang(l){LANG=l;localStorage.setItem('ckLang',l);document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';trAll();tab('me')}
function trStr(s){if(LANG==='ar'||!s)return s;const ex=I18[s.trim()];if(ex&&ex[LANG])return s.replace(s.trim(),ex[LANG]);const m=s.match(/^([^\u0600-\u06FF]*?)([\u0600-\u06FF].*?[\u0600-\u06FF!.:؟?]|[\u0600-\u06FF]+)([^\u0600-\u06FF]*)$/s);if(!m)return s;
 const full=m[2].trim();if(I18[full]&&I18[full][LANG])return m[1]+I18[full][LANG]+m[3];
 if(full.length>70)return s;
 const parts=full.split(' · ');let ch=0;const out=parts.map(p=>{const q=p.match(/^([\d\/\s]*)(.*?)([\d\s()\/]*)$/s);const core=q[2].trim();const e=I18[core];if(e&&e[LANG]){ch=1;return q[1]+e[LANG]+q[3]}return p});
 return ch?m[1]+out.join(' · ')+m[3]:s}

const b64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function courseOpen(id,code,ui){code=(code||'').trim().toUpperCase();if(!code)return;const e=ENC.find(x=>x.id===id);let f=window.ENCB&&window.ENCB[id],live=false;try{const r=await getJSON('enc-'+id+'.json');if(r&&r.w){f=r;live=true}}catch(x){}
try{const kid=code.split('-')[1];const w=f.w[kid];if(!w)throw 0;
const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
const wk=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(w.s),iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
const K=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(w.i)},wk,b64(w.d));
const ck=await crypto.subtle.importKey('raw',K,'AES-GCM',false,['decrypt']);
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(f.i)},ck,b64(f.d));const P=JSON.parse(new TextDecoder().decode(pt));
const i=TRACKS.findIndex(t=>t.id===id);const tr={id,t:e.t,e:e.e,c:e.c,d:e.d+' · مفتوحة',lang:null,full:true,v:P.v||[],L:P.L};if(i>=0)TRACKS[i]=tr;else TRACKS.push(tr);recount();S.cc[id]=code;save();
if(ui){toast('تم فتح الدورة 🎉');boom();setTimeout(()=>track(id),700)}}
catch(x){if(live&&S.cc[id]===code){delete S.cc[id];save();const i=TRACKS.findIndex(t=>t.id===id);if(i>=0)TRACKS.splice(i,1);recount();toast('انتهى هذا الكود')}if(ui)toast(live||f?'الكود غير صحيح':'تأكد من الإنترنت')}}
function me(){nav('me');let h='<h2>حسابي</h2>'+langBox();
if(S.user){h+=`<div class="box" style="text-align:center">${S.user.picture?'<img src="'+esc(S.user.picture)+'" style="width:72px;height:72px;border-radius:50%">':'<div style="font-size:48px">👤</div>'}<h3 style="font-size:20px">${esc(S.user.name||'')}</h3><div class="small">${esc(S.user.email||'')}</div><button class="btn s" onclick="logout()">تسجيل الخروج</button></div>`}
else h+=`<div class="box"><p>سجّل الدخول بحساب جوجل لحفظ اسمك وتقدمك على هذا الجهاز.</p><button class="g-btn" onclick="glogin()"><svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.5 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.100 0 24s.9 7.600 2.600 10.800l7.900-6.100z"/><path fill="#34A853" d="M24 48c6.500 0 11.900-2.100 15.900-5.800l-7.500-5.800c-2.100 1.400-4.800 2.300-8.400 2.300-6.300 0-11.600-4-13.500-9.800l-7.900 6.100C6.500 42.600 14.600 48 24 48z"/></svg>تسجيل الدخول بجوجل</button><p class="small" id="gmsg"></p></div>`;
h+=`<div class="box"><h3>عن التطبيق</h3><p class="small">من تطوير وملكية: ${(CRED&&CRED.about)||CREDDEF}</p><p class="small">كود زون v1.6. الشرح مكتوب بالعربية والكود بالإنجليزية. الفيديوهات تُعرض من قنوات أصحابها على يوتيوب بالمشغل الرسمي، ولا يتم نسخها أو رفعها.</p></div>`;app.innerHTML=h}
function glogin(){const m=$('#gmsg');if(window.Native&&Native.login){m.textContent='جاري فتح جوجل...';Native.login()}else m.textContent='تسجيل الدخول يعمل داخل تطبيق الأندرويد فقط.'}
function logout(){S.user=null;save();if(window.Native&&Native.logout)Native.logout();topbar();me()}
window.onGoogleLogin=function(j){try{const u=typeof j==='string'?JSON.parse(j):j;if(u.error){const m=$('#gmsg');if(m)m.textContent='تعذر تسجيل الدخول: '+u.error;toast('تعذر تسجيل الدخول');return}S.user=u;save();topbar();toast('أهلا '+(u.name||''));boom();me()}catch(e){}}
function boom(){const c=$('#cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const P=[...Array(80)].map(()=>({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*14,vy:Math.random()*-14-3,c:['#f472b6','#fb923c','#fbbf24','#34d399','#a78bfa'][Math.floor(Math.random()*5)],s:5+Math.random()*6}));let f=0;(function a(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;x.fillStyle=p.c;x.fillRect(p.x,p.y,p.s,p.s)});if(++f<80)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})()}
streak();topbar();home();

Object.keys(S.cc||{}).forEach(id=>courseOpen(id,S.cc[id],false));syncContent();

trAll();
