4\u0644"]),U(["What happens when: a shell is pressed into clay and plaster is poured into the cavity?","\u0645\u0627\u0630\u0627 \u064A\u062D\u062F\u062B \u0639\u0646\u062F: \u0636\u063A\u0637 \u0635\u062F\u0641\u0629 \u0641\u064A \u0627\u0644\u0635\u0644\u0635\u0627\u0644 \u062B\u0645 \u0635\u0628 \u0627\u0644\u062C\u0628\u0633 \u0641\u064A \u0627\u0644\u062A\u062C\u0648\u064A\u0641\u061F"],["The clay gives a mold; the hardened plaster gives a cast.","\u064A\u0639\u0637\u064A \u0627\u0644\u0635\u0644\u0635\u0627\u0644 \u0642\u0627\u0644\u0628\u0627 \u062E\u0627\u0631\u062C\u064A\u0627\u060C \u0648\u064A\u0639\u0637\u064A \u0627\u0644\u062C\u0628\u0633 \u0627\u0644\u0645\u062A\u0635\u0644\u0628 \u0642\u0627\u0644\u0628\u0627 \u062F\u0627\u062E\u0644\u064A\u0627."],["mold,cast","\u0642\u0627\u0644\u0628 \u062E\u0627\u0631\u062C\u064A|\u062E\u0627\u0631\u062C\u064A,\u0642\u0627\u0644\u0628 \u062F\u0627\u062E\u0644\u064A|\u062F\u0627\u062E\u0644\u064A"]),U(["What happens when: a group of a species is separated by a mountain range for a long time?","\u0645\u0627\u0630\u0627 \u064A\u062D\u062F\u062B \u0639\u0646\u062F: \u0641\u0635\u0644 \u0645\u062C\u0645\u0648\u0639\u0629 \u0645\u0646 \u0646\u0648\u0639 \u0645\u0627 \u0628\u0633\u0644\u0633\u0644\u0629 \u062C\u0628\u0627\u0644 \u0644\u0641\u062A\u0631\u0629 \u0637\u0648\u064A\u0644\u0629\u061F"],["Gene flow stops, mutations accumulate and natural selection acts separately, so a new species may form.","\u064A\u062A\u0648\u0642\u0641 \u0627\u0646\u062A\u0642\u0627\u0644 \u0627\u0644\u062C\u064A\u0646\u0627\u062A \u0648\u062A\u062A\u0631\u0627\u0643\u0645 \u0627\u0644\u0637\u0641\u0631\u0627\u062A \u0648\u064A\u0639\u0645\u0644 \u0627\u0644\u0627\u0646\u062A\u062E\u0627\u0628 \u0627\u0644\u0637\u0628\u064A\u0639\u064A \u0628\u0634\u0643\u0644 \u0645\u0646\u0641\u0635\u0644 \u0641\u0642\u062F \u064A\u0646\u0634\u0623 \u0646\u0648\u0639 \u062C\u062F\u064A\u062F."],["gene|mating,mutation,new species|species","\u062C\u064A\u0646|\u062A\u0632\u0627\u0648\u062C,\u0637\u0641\u0631\u0627\u062A|\u0637\u0641\u0631\u0629,\u0646\u0648\u0639 \u062C\u062F\u064A\u062F|\u0646\u0648\u0639"]),U(["What happens when: a huge meteorite hits Earth?","\u0645\u0627\u0630\u0627 \u064A\u062D\u062F\u062B \u0639\u0646\u062F: \u0627\u0635\u0637\u062F\u0627\u0645 \u0646\u064A\u0632\u0643 \u0636\u062E\u0645 \u0628\u0627\u0644\u0623\u0631\u0636\u061F"],["It can cause severe climate change and a mass extinction of many species.","\u0642\u062F \u064A\u0633\u0628\u0628 \u062A\u063A\u064A\u0631\u0627 \u0645\u0646\u0627\u062E\u064A\u0627 \u062D\u0627\u062F\u0627 \u0648\u0627\u0646\u0642\u0631\u0627\u0636\u0627 \u062C\u0645\u0627\u0639\u064A\u0627 \u0644\u0623\u0646\u0648\u0627\u0639 \u0643\u062B\u064A\u0631\u0629."],["climate|environment,extinct","\u0645\u0646\u0627\u062E|\u0628\u064A\u0626,\u0627\u0646\u0642\u0631\u0627\u0636"]),V(["Compare: mold fossil and cast fossil (how each forms).","\u0642\u0627\u0631\u0646 \u0628\u064A\u0646: \u0627\u0644\u0642\u0627\u0644\u0628 \u0627\u0644\u062E\u0627\u0631\u062C\u064A \u0648\u0627\u0644\u0642\u0627\u0644\u0628 \u0627\u0644\u062F\u0627\u062E\u0644\u064A (\u0637\u0631\u064A\u0642\u0629 \u0627\u0644\u062A\u0643\u0648\u064A\u0646)."],["Mold: an impression of the external surface in rock. Cast: the internal cavity of a shell filled with minerals or sediments that harden.","\u0627\u0644\u062E\u0627\u0631\u062C\u064A: \u0627\u0646\u0637\u0628\u0627\u0639 \u0627\u0644\u0633\u0637\u062D \u0627\u0644\u062E\u0627\u0631\u062C\u064A \u0641\u064A \u0627\u0644\u0635\u062E\u0631. \u0627\u0644\u062F\u0627\u062E\u0644\u064A: \u062A\u062C\u0648\u064A\u0641 \u0627\u0644\u0635\u062F\u0641\u0629 \u0627\u0644\u062F\u0627\u062E\u0644\u064A \u064A\u0645\u062A\u0644\u0626 \u0628\u0645\u0639\u0627\u062F\u0646 \u0623\u0648 \u0631\u0648\u0627\u0633\u0628 \u062A\u062A\u0635\u0644\u0628."],["mold,external|outer,cast,cavity|internal","\u062E\u0627\u0631\u062C\u064A,\u0627\u0646\u0637\u0628\u0627\u0639,\u062 \u0636: \u0635\u062E\u0648\u0631 \u062C\u0628\u0627\u0644 \u0627\u0644\u0628\u062D\u0631 \u0627\u0644\u0623\u062D\u0645\u0631 \u0648\u0627\u0644\u0639\u0648\u064A\u0646\u0627\u062A \u0645\u0646 \u0623\u0642\u062F\u0645 \u0627\u0644\u0635\u062E\u0648\u0631."],["Basalt (igneous) over limestone (sedimentary, formed on sea floors), as in Abu Rawash: the area was under sea, then volcanoes covered it with basalt.","\u0627\u0644\u0628\u0627\u0632\u0644\u062A (\u0646\u0627\u0631\u064A) \u0641\u0648\u0642 \u0627\u0644\u062D\u062C\u0631 \u0627\u0644\u062C\u064A\u0631\u064A (\u0631\u0633\u0648\u0628\u064A \u064A\u062A\u0643\u0648\u0646 \u0641\u064A \u0642\u0627\u0639 \u0627\u0644\u0628\u062D\u0627\u0631) \u0643\u0645\u0627 \u0641\u064A \u0623\u0628\u0648 \u0631\u0648\u0627\u0634: \u0643\u0627\u0646\u062A \u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u062A\u062D\u062A \u0627\u0644\u0628\u062D\u0631 \u062B\u0645 \u063A\u0637\u062A\u0647\u0627 \u0627\u0644\u0628\u0631\u0627\u0643\u064A\u0646 \u0628\u0627\u0644\u0628\u0627\u0632\u0644\u062A."],["Marine fossils on Himalayan peaks: it was once a sea floor, uplifted by the collision of tectonic plates.","\u062D\u0641\u0631\u064A\u0627\u062A \u0628\u062D\u0631\u064A\u0629 \u0639\u0644\u0649 \u0642\u0645\u0645 \u0627\u0644\u0647\u064A\u0645\u0627\u0644\u0627\u064A\u0627: \u0643\u0627\u0646\u062A \u0642\u0627\u0639 \u0628\u062D\u0631 \u062B\u0645 \u0627\u0631\u062A\u0641\u0639 \u0628\u062A\u0635\u0627\u062F\u0645 \u0627\u0644\u0635\u0641\u0627\u0626\u062D \u0627\u0644\u062A\u0643\u062A\u0648\u0646\u064A\u0629."],["A fossil type that appears in a layer worldwide and then vanishes from higher layers means those organisms became extinct (e.g. dinosaurs).","\u0638\u0647\u0648\u0631 \u0646\u0648\u0639 \u062D\u0641\u0631\u064A\u0629 \u0641\u064A \u0637\u0628\u0642\u0629 \u062D\u0648\u0644 \u0627\u0644\u0639\u0627\u0644\u0645 \u062B\u0645 \u0627\u062E\u062A\u0641\u0627\u0624\u0647 \u0645\u0646 \u0627\u0644\u0637\u0628\u0642\u0627\u062A \u0627\u0644\u0623\u0639\u0644\u0649 \u064A\u0639\u0646\u064A \u0627\u0646\u0642\u0631\u0627\u0636 \u0647\u0630\u0647 \u0627\u0644\u0643\u0627\u0626\u0646\u0627\u062A (\u0645\u062B\u0644 \u0627\u0644\u062F\u064A\u0646\u0627\u0635\u0648\u0631\u0627\u062A)."]])],q(["Marine fossils on a mountain peak show that the place was once ...","\u0648\u062C\u0648\u062F \u062D\u0641\u0631\u064A\u0627\u062A \u0628\u062D\u0631\u064A\u0629 \u0639\u0644\u0649 \u0642\u0645\u0629 \u062C\u0628\u0644 \u064A\u062F\u0644 \u0639\u0644\u0649 \u0623\u0646 \u0627\u0644\u0645\u0643\u0627\u0646 \u0643\u0627\u0646 ..."],[["A desert","A sea floor","A glacier","A forest only"],["\u0635\u062D\u0631\u0627\u0621","\u0642\u0627\u0639 \u0628\u062D\u0631","\u062C\u0644\u064A\u062F\u0627","\u063A\u0627\u0628\u0629 \u0641\u0642\u0637"]],1)),P(["4. Relative dating: superposition","4. \u0627\u0644\u062A\u0623\u0631\u064A\u062E \u0627\u0644\u0646\u0633\u0628\u064A: \u0627\u0644\u062A\u0639\u0627\u0642\u0628 \u0627\u0644\u0637\u0628\u0642\u064A"],[M(["Relative dating: finding whether a rock is older or younger than another rock without finding its age in years.","\u0627\u0644\u062A\u0623\u0631\u064A\u062E \u0627\u0644\u0646\u0633\u0628\u064A: \u062A\u062D\u062F\u064A\u062F \u0647\u0644 \u0627\u0644\u0635\u062E\u0631 \u0623\u0642\u062F\u0645 \u0623\u0645 \u0623\u062D\u062F\u062B \u0645\u0646 \u0635\u062E\u0631 \u0622\u062E\u0631 \u062F\u0648\u0646 \u062A\u062D\u062F\u064A\u062F \u0639\u0645\u0631\u0647 \u0628\u0627\u0644\u0633\u0646\u064A\u0646."]),M(["Law of superposition: in an undisturbed sequence of sedimentary rock layers, the oldest layer is at the bottom and the youngest is at the top.","\u0642\u0627\u0646\u0648\u0646 \u0627\u0644\u062A\u0639\u0627\u0642\u0628 \u0627\u0644\u0637\u0628\u0642\u064A: \u0641\u064A \u062A\u062A\u0627\u0628\u0639 \u063A\u064A\u0631 \u0645\u0636\u0637\u0631\u0628 \u0645\u0646 \u0637\u0628\u0642\u0627\u062A \u0627\u0644\u0635\u062E\u0648\u0631 \u0627\u0644\u0631\u0633\u0648\u0628\u064A\u0629 \u062A\u0643\u0648\u0646 \u0627\u0644\u0637\u0628\u0642\u0629 \u0627\u0644\u0623\u0642\u062F\u0645 \u0641\u064A \u0627\u0644\u0623\u0633\u0641\u0644 \u0648\u0627\u0644\u0623\u062D\u062F\u062B \u0641\u064A \u0627\u0644\u0623\u0639\u0644\u0649."]),he(["If a dinosaur fossil is in a lower layer X and a mammal fossil in the layer Y above it, then layer X is older than layer Y.","\u0625\u0630\u0627 \u0648\u062C\u062F\u062A \u062D\u0641\u0631\u064A\u0629 \u062F\u064A\u0646\u0627\u0635\u0648\u0631 \u0641\u064A \u0637\u0628\u0642\u0629 \u0633\u0641\u0644\u0649 X \u0648\u062D\u0641\u0631\u064A\u0629 \u062B\u062F\u064A \u0641\u064A \u0627\u0644\u0637\u0628\u0642\u0629 Y \u0627\u0644\u062A\u064A \u0641\u0648\u0642\u0647\u0627 \u0641\u0625\u0646 \u0627\u0644\u0637\u0628\u0642\u0629 X \u0623\u0642\u062F\u0645 \u0645\u0646 \u0627\u0644\u0637\u0628\u0642\u0629 Y."])],q(["In undisturbed layers the oldest layer is ...","\u0641\u064A \u0627\u0644\u0637\u0628\u0642\u0627\u062A \u063A\u064A\u0631 \u0627\u0644\u0645\u0636\u0637\u0631\u0628\u0629 \u062A\u0643\u0648\u0646 \u0627\u0644\u0637\u0628\u0642\u0629 \u0627\u0644\u0623\u0642\u062F\u0645 ..."],[["On top","At the bottom","In the middle","Not found"],["\u0641\u064A \u0627\u0644\u0623\u0639\u0644\u0649","\u0641\u064A \u0627\u0644\u0623\u0633\u0641\u0644","\u0641\u064A \u0627\u0644\u0648\u0633\u0637","\u063A\u064A\u0631 \u0645\u0648\u062C\u0648\u062F\u0629"]],1)),P(["5. Relative dating: index fossils","5. \u0627\u0644\u062A\u0623\u0631\u064A\u062E \u0627\u0644\u0646\u0633\u0628\u064A: \u0627\u0644\u062D\u0641\u0631\u064A\u0627\u062A \u0627\u0644\u0645\u0631\u0634\u062F\u0629"],[M(["Index fossils: fossils of organisms that lived for a SHORT time, were WIDELY distributed, then became extinct and do not appear in later periods. Examples: trilobites and ammonites.","\u0627\u0644\u062D\u0641\u0631\u064A\u0627\u062A \u0627\u0644\u0645\u0631\u0634\u062F\u0629: \u062D\u0641\u0631\u064A\u0627\u062A \u0644\u0643\u0627\u0626\u0646\u0627\u062A 4\u0645\u0631\u0634\u062F\u0629 \u0641\u064A \u0637\u0628\u0642\u0627\u062A \u0645\u0639\u064A\u0646\u0629 \u064A\u0633\u0627\u0639\u062F \u0641\u064A \u062A\u0623\u0631\u064A\u062E \u0627\u0644\u0637\u0628\u0642\u0627\u062A."])],q(["An index fossil has ... distribution and ... time range.","\u0627\u0644\u062D\u0641\u0631\u064A\u0629 \u0627\u0644\u0645\u0631\u0634\u062F\u0629 \u0644\u0647\u0627 \u0627\u0646\u062A\u0634\u0627\u0631 ... \u0648\u0645\u062F\u0649 \u0632\u0645\u0646\u064A ..."],[["Wide, short","Narrow, long","Narrow, short","Wide, very long"],["\u0648\u0627\u0633\u0639\u060C \u0642\u0635\u064A\u0631","\u0636\u064A\u0642\u060C \u0637\u0648\u064A\u0644","\u0636\u064A\u0642\u060C \u0642\u0635\u064A\u0631","\u0648\u0627\u0633\u0639\u060C \u0637\u0648\u064A\u0644 \u062C\u062F\u0627"]],0)),P(["6. Absolute dating and radioactivity","6. \u0627\u0644\u062A\u0623\u0631\u064A\u062E \u0627\u0644\u0645\u0637\u0644\u0642 \u0648\u0627\u0644\u0646\u0634\u0627\u0637 \u0627\u0644\u0625\u0634\u0639\u0627\u0639\u064A"],[M(["Absolute dating: finding the actual age of a rock or fossil in years, using radioactivity.","\u0627\u0644\u062A\u0623\u0631\u064A\u062E \u0627\u0644\u0645\u0637\u0644\u0642: \u062A\u062D\u062F\u064A\u062F \u0627\u0644\u0639\u0645\u0631 \u0627\u0644\u062D\u0642\u064A\u0642\u064A \u0644\u0644\u0635\u062E\u0631 \u0623\u0648 \u0627\u0644\u062D\u0641\u0631\u064A\u0629 \u0628\u0627\u0644\u0633\u0646\u064A\u0646 \u0628\u0627\u0633\u062A\u062E\u062F\u0627\u0645 \u0627\u0644\u0646\u0634\u0627\u0637 \u0627\u0644\u0625\u0634\u0639\u0627\u0639\u064A."]),L(["Some minerals contain unstable radioactive isotopes such as uranium-238 and carbon-14. Their nuclei emit radiation and change into more stable elements, decaying gradually at a constant rate characteristic of each element.","\u062A\u062D\u062A\u0648\u064A \u0628\u0639\u0636 \u0627\u0644\u0645\u0639\u0627\u062F\u0646 \u0639\u0644\u0649 \u0646\u0638\u0627\u0626\u0631 \u0645\u0634\u0639\u0629 \u063A\u064A\u0631 \u06 4\u0628\u062D\u0631\u064A\u0629."])],[jh,Yh]=ze("u4l2",4,["Geologic Time","\u0627\u0644\u0623\u0632\u0645\u0646\u0629 \u0627\u0644\u062C\u064A\u0648\u0644\u0648\u062C\u064A\u0629"],["Unit 4 - Lesson 2","\u0627\u0644\u0648\u062D\u062F\u0629 \u0627\u0644\u0631\u0627\u0628\u0639\u0629 - \u0627\u0644\u062F\u0631\u0633 \u0627\u0644\u062B\u0627\u0646\u064A"],Vg,[...jg,...Be.u4l2],[...Yg,...We.u4l2]);var $h={MCQ:"Choose the correct answer",TF:"True or False (correct the false)",GiveReason:"Give reason",WhatHappens:"What happens when",Compare:"Compare"},$g=[{heading:"1. What is a chemical reaction?",blocks:[{kind:"def",text:"A chemical reaction is a process in which bonds are broken in the molecules of the reactants and new bonds are formed in the molecules of the products. The products have properties different from the reactants."},{kind:"p",text:"Indicators that a chemical reaction has occurred:"},{kind:"chips",items:["Colour change","Odour emission","Gas evolution","Precipitate formation","Light and heat emission"]}],quickChecks:[{q:"Which of these is NOT an indication of a chemical reaction?",options:["Gas evolution","Colour change","Change in physical state","Precipitate formation"],answer:2}]},{heading:"2. The four main types",blocks:[{kind:"p",text:"Reactions are classified by how atoms or ions rearrange and bind together:"},{kind:"eq",text:"A + B -> AB   (Direct combination)"},{kind:"eq",text:"AB -> A + B   (Decomposition)"},{kind:"eq",text:"A + BC -> AC + B   (Single replacement)"},{kind:"eq",text:"AB + CD -> AD + CB   (Double replacement)"}],quickChecks:[{q:"A + BC -> AC + B is a ...",options:["Direct combination","Decomposition","Single replacement","Double replacement"],answer:2}]},{heading:"3. Direct combination reactions",blocks:[{kind:"def",text:"Two or more substances combine to form one new compound. Most metals combine with atmospheric oxygen when heated, forming metal oxides."},{kind:"eq",text:"2Mg + O2 -> 2MgO (white)"},{kind:"eq",text:"3Fe + 2O2 -> Fe3O4 (magnetic iron oxide)"},{kind:"eq",text:"2Cu + O2 -> 2CuO (black)"},{kind:"bullets",items:["Magnesium ribbon: ignites rapidly with a bright white flame, forming white magnesium oxide MgO.","Steel wool (Fe): burns with bright sparks, forming magnetic iron oxide Fe3O4.","Copper wire: no visible flame; a black layer of copper oxide CuO forms.","Reactivity with oxygen: Mg > Fe > Cu."]},{kind:"warn",text:"Safety: wear goggles and do not stare at burning magnesium - its intense light and ultraviolet radiation can damage the retina."}],quickChecks:[{q:"Burning magnesium in air forms ...",options:["Black magnesium oxide","White magnesium oxide","White magnesium chloride","Red magnesium"],answer:1}]},{heading:"4. Decomposition reactions",blocks:[{kind:"def",text:"The reverse of direct combination: a compound breaks down into simpler components using energy (heat or light). AB -> A + B."},{kind:"p",text:"a) Some metal oxides decompose by heat into the metal and oxygen gas. Red mercury oxide turns into silver-coloured liquid mercury, and the oxygen produced increases the glow of a lighted matchstick."},{kind:"eq",text:"2HgO -> 2Hg + O2"},{kind:"p",text:"b) Some metal carbonates decompose by heat into the metal oxide and carbon dioxide gas, which turns clear limewater turbid (milky)."},{kind:"eq",text:"CaCO3 -> CaO + CO2"}],quickChecks:[{q:"Heating calcium carbonate gives calcium oxide and ...",options:["Oxygen","Hydrogen","Carbon dioxide","Water"],answer:2}]},{heading:"5. Single replacement reactions",blocks:[{kind:"def",text:"An element replaces another element in one of its compounds: A + BC -> AC + B. Metals are arranged by reactivity in the chemical reactivity series."},{kind:"series"},{kind:"p",text:"Teal = metals that precede hydrogen (react with dilute acids). Yellow = hydrogen (the reference). Purple = metals that follow hydrogen (do not react with dilute acids)."},{kind:"p",text:"a) Replacement of hydrogen in an acid by a metal:"},{kind:"eq",text:"Mg + 2HCl -> MgCl2 + H2"},{kind:"eq",text:"Zn + 2HCl -> ZnCl2 + H2"},{kind:"eq",text:"Fe + 2HCl -> FeCl2 + H2"},{kind:"eq",text:"Cu + HCl -> no reaction"},{kind:"bullets",items:["Rate of hydrogen bubbles: Mg > Zn > Fe.","The hydrogen gas produced burns with a pop sound when a lighted splint is brought near.","Copper follows hydrogen in the series, so it cannot replace it in dilute acids.","Enrichment: aluminium reacts slowly at first because of the insulating Al2O3 layer on its surface."]},{kind:"p",text:"b) Replacement of hydrogen in water by a metal:"},{kind:"eq",text:"2Na + 2H2O -> 2NaOH + H2 + heat"},{kind:"bullets",items:["Sodium is kept in kerosene; it floats on water (lower density), moves rapidly, and burns with a yellowish-orange flame.","Magnesium reacts only with hot water, because it is less reactive than sodium and needs thermal energy to start."]},{kind:"warn",text:"Use a very small piece of sodium. Never extinguish sodium fires with water (the heat may ignite the evolved hydrogen or cause an explosion) - use dry sand instead."},{kind:"p",text:"c) Replacement of a metal by another metal in its salt solution: the more reactive metal replaces the less reactive one. When a zinc rod is immersed in blue copper sulphate solution, the blue colour fades gradually and red copper is deposited on the rod."},{kind:"eq",text:"Zn + CuSO4 -> ZnSO4 + Cu"},{kind:"info",text:"Life application: aluminium foil with hot water and sodium bicarbonate restores the luster of silverware, because aluminium replaces silver in the black silver sulphide layer. For the same reason, silver nitrate solution must not be stored in aluminium containers."}],quickChecks:[{q:"Which metal does NOT replace hydrogen in dilute HCl?",options:["Zinc","Iron","Copper","Magnesium"],answer:2},{q:"Iron can replace copper from CuSO4 solution because iron ...",options:["is cheaper","precedes copper in the series","follows copper in the series","is magnetic"],answer:1}]},{heading:"6. Double replacement reactions",blocks:[{kind:"def",text:"Reactions between two ionic compounds (usually in aqueous solution) in which cations and anions exchange positions: AB + CD -> AD + CB."},{kind:"p",text:"a) Acid + alkali = neutralization (salt + water). Universal indicator is violet in NaOH; adding HCl drop by drop makes the colour turn gradually until it becomes green at the neutralization point (pH 7)."},{kind:"eq",text:"NaOH + HCl -> NaCl + H2O"},{kind:"eq",text:"2NaOH + H2SO4 -> Na2SO4 + 2H2O"},{kind:"p",text:"b) Acid + salt: HCl reacts with sodium carbonate, forming NaCl and carbonic acid, which decomposes into water and CO2 (turns limewater turbid)."},{kind:"eq",text:"Na2CO3 + 2HCl -> 2NaCl + H2O + CO2"},{kind:"p",text:"c) Salt solution + salt solution (precipitation): a white precipitate of silver chloride forms and turns violet in light."},{kind:"eq",text:"NaCl + AgNO3 -> NaNO3 + AgCl (white precipitate)"},{kind:"info",text:"Hard water (containing Ca and Mg salts) leaves deposits in pipes; adding sodium carbonate precipitates CaCO3 and MgCO3 so they can be removed."}],quickChecks:[{q:"A white precipitate forms when AgNO3 solution is added to ...",options:["NaOH","NaCl","water","zinc"],answer:1}]},{heading:"7. Oxidation and reduction (Redox)",blocks:[{kind:"p",text:"Traditional concept: oxidation = gain of oxygen or loss of hydrogen; reduction = loss of oxygen or gain of hydrogen."},{kind:"def",text:"Electronic concept: oxidation = loss of electrons; reduction = gain of electrons. The reducing agent loses electrons (is oxidized); the oxidizing agent gains electrons (is reduced). Both processes happen at the same time, because the electrons lost equal the electrons gained."},{kind:"eq",text:"Zn -> Zn\xB2\u207A + 2e\u207B   (oxidation)"},{kind:"eq",text:"Cu\xB2\u207A + 2e\u207B -> Cu   (reduction)"},{kind:"bullets",items:["Metals usually lose electrons, so they act as reducing agents.","Non-metals usually gain electrons, so they act as oxidizing agents.","In Mg + Br2 -> MgBr2: Mg is the reducing agent and Br2 is the oxidizing agent."]}],quickChecks:[{q:"The oxidizing agent ...",options:["loses electrons","gains electrons","is oxidized","gains protons"],answer:1}]},{heading:"Lesson summary",blocks:[{kind:"bullets",items:["Chemical reaction: bonds broken in reactants, new bonds formed in products.","Direct combination: A + B -> AB. 2Mg + O2 -> 2MgO (white), 3Fe + 2O2 -> Fe3O4, 2Cu + O2 -> 2CuO (black).","Decomposition: AB -> A + B. 2HgO -> 2Hg + O2, CaCO3 -> CaO + CO2.","Single replacement: A + BC -> AC + B. Mg/Zn/Fe react with dilute HCl giving H2; Cu does not react.","Metal + water: 2Na + 2H2O -> 2NaOH + H2 + heat (Mg needs hot water).","Metal + salt solution: Zn + CuSO4 -> ZnSO4 + Cu.","Reactivity series: K Na Li Ba Ca Mg Al Zn Fe Sn Pb H Cu Hg Ag Pt Au.","Double replacement: AB + CD -> AD + CB (ionic compounds in aqueous solution).","Neutralization: acid + alkali -> salt + water. NaOH + HCl -> NaCl + H2O.","Acid + salt: Na2CO3 + 2HCl -> 2NaCl + H2O + CO2.","Precipitation: NaCl + AgNO3 -> NaNO3 + AgCl (white, turns violet in light).","Oxidation = loss of electrons; reduction = gain of electrons. Reducing agent loses electrons (oxidized); oxidizing agent gains electrons (reduced)."]}],quickChecks:[]}],Kg=[{t:"GiveReason",q:"Give reason: A white substance is formed when a magnesium ribbon is ignited in air.",a:"Because magnesium combines with oxygen of the air forming white magnesium oxide (MgO).",k:"oxygen|o2,magnesium oxide|mgo"},{t:"GiveReason",q:"Give reason: A black layer is formed when copper is heated in air.",a:"Because copper combines with oxygen forming black copper(II) oxide (CuO).",k:"oxygen|o2,copper oxide|cuo|copper(ii) oxide"},{t:"GiveReason",q:"Give reason: Safety goggles must be worn when burning a magnesium ribbon.",a:"Burning magnesium produces highly intense light accompanied by ultraviolet radiation that may damage the retina.",k:"light|glare,ultraviolet|uv,retina|eye"},{t:"GiveReason",q:"Give reason: A silver colour appears when red mercury oxide is heated.",a:"Because HgO decomposes by heat into silver-coloured mercury and oxygen gas: 2HgO -> 2Hg + O2.",k:"mercury|hg,decompos,oxygen|o2"},{t:"GiveReason",q:"Give reason: Copper does not react with dilute hydrochloric acid.",a:"Because copper follows hydrogen in the reactivity series (it is less reactive), so it cannot replace the hydrogen of the acid.",k:"follow|after|below|lower|less reactive,hydrogen,not replace|cannot replace|can not replace|doesn"},{t:"GiveReason",q:"Give reason: Sodium floats on the surface of water.",a:"Because its density is lower than that of water.",k:"density,lower|less|smaller"},{t:"GiveReason",q:"Give reason: Sodium fires must not be extinguished with water.",a:"The reaction of sodium with water releases a large amount of heat that may ignite the evolved hydrogen or cause an explosion.",k:"heat,hydrogen|ignite,explo"},{t:"GiveReason",q:"Give reason: Silver nitrate solution must not be stored in aluminium containers.",a:"Because aluminium precedes silver in the reactivity series, so it replaces silver from its solution and the container is corroded.",k:"precede|more reactive|above|before,replace,corrod"},{t:"GiveReason",q:"Give reason: Zinc acts as a reducing agent when it reacts with copper sulphate solution.",a:"Because each zinc atom loses two electrons (is oxidized) to become Zn\xB2\u207A.",k:"lose|loses|lost,electron,oxidi"},{t:"GiveReason",q:"Give reason: Oxidation and reduction are concurrent processes.",a:"Because the number of electrons gained in reduction equals the number of electrons lost in oxidation.",k:"electron,equal|same|number|gained|lost"},{t:"WhatHappens",q:"What happens when: A zinc rod is immersed in blue copper sulphate solution? (write the equation)",a:"The blue colour fades gradually, a colourless zinc sulphate solution forms and red copper is deposited on the rod: Zn + CuSO4 -> ZnSO4 + Cu.",k:"blue,disappear|fade|colourless|colorless,red,copper"},{t:"WhatHappens",q:"What happens when: Dilute HCl is added drop by drop to NaOH solution containing universal indicator until neutralization?",a:"The colour changes from violet to green; NaCl and water form: NaOH + HCl -> NaCl + H2O.",k:"violet,green,neutral|nacl|salt"},{t:"WhatHappens",q:"What happens when: CO2 gas is passed through clear limewater for a short time?",a:"The clear limewater turns turbid (milky).",k:"turbid|milky|cloudy"},{t:"WhatHappens",q:"What happens when: A very small piece of sodium is placed in water?",a:"It floats and moves rapidly, hydrogen gas evolves and burns with a yellowish-orange flame, forming sodium hydroxide solution: 2Na + 2H2O -> 2NaOH + H2 + heat.",k:"float,hydrogen,flame,sodium hydroxide|naoh"},{t:"WhatHappens",q:"What happens when: Silver nitrate solution is added to sodium chloride solution?",a:"A white precipitate of silver chloride forms (turns violet in light), and sodium nitrate solution remains: NaCl + AgNO3 -> NaNO3 + AgCl.",k:"white,precipitate,silver chloride|agcl"},{t:"Compare",q:"Compare: Igniting magnesium ribbon and steel wool in air (observation - product).",a:"Magnesium: bright white flame, white magnesium oxide MgO. Steel wool: bright sparks, magnetic iron oxide Fe3O4.",k:"white,magnesium oxide|mgo,spark,fe3o4|magnetic"},{t:"Compare",q:"Compare: Heating magnesium in air and heating red mercury oxide (type of reaction - products).",a:"Magnesium: direct combination -> magnesium oxide. Mercury oxide: decomposition -> mercury + oxygen.",k:"combination,magnesium oxide|mgo,decompos,mercury,oxygen"},{t:"Compare",q:"Compare: Thermal decomposition of a metal oxide and of a metal carbonate (products).",a:"Metal oxide -> metal + oxygen gas. Metal carbonate -> metal oxide + carbon dioxide gas.",k:"oxide,metal,oxygen,carbonate,carbon dioxide|co2"},{t:"Compare",q:"Compare: Magnesium and zinc with dilute HCl (rate of reaction - bubbles).",a:"Magnesium reacts rapidly with many bubbles (more reactive); zinc reacts more slowly with fewer bubbles.",k:"magnesium,rapid|fast|m CO3).","\u0623\u0648\u0644 \u0623\u0643\u0633\u064A\u062F \u0627\u0644\u0643\u0631\u0628\u0648\u0646 (CO): \u064A\u0646\u062A\u062C \u0645\u0646 \u0627\u0644\u0627\u062D\u062A\u0631\u0627\u0642 \u063A\u064A\u0631 \u0627\u0644\u062A\u0627\u0645 \u0628\u0633\u0628\u0628 \u0646\u0642\u0635 \u0627\u0644\u0623\u0643\u0633\u062C\u064A\u0646\u061B \u063A\u0627\u0632 \u0633\u0627\u0645 \u0639\u062F\u064A\u0645 \u0627\u0644\u0644\u0648\u0646 \u0648\u0627\u0644\u0631\u0627\u0626\u062D\u0629.","\u0628\u062E\u0627\u0631 \u0627\u0644\u0645\u0627\u0621 (H2O): \u064A\u0646\u062A\u062C \u0645\u0646 \u0627\u062D\u062A\u0631\u0627\u0642 \u0627\u0644\u0647\u064A\u062F\u0631\u0648\u062C\u064A\u0646 \u0648\u0627\u0644\u0645\u0648\u0627\u062F \u0627\u0644\u0645\u062D\u062A\u0648\u064A\u0629 \u0639\u0644\u064A\u0647 \u0645\u062B\u0644 \u0627\u0644\u0647\u064A\u062F\u0631\u0648\u0643\u0631\u0628\u0648\u0646\u0627\u062A\u060C \u0648\u064A\u062A\u0643\u062B\u0641 \u0625\u0644\u0649 \u0642\u0637\u0631\u0627\u062A \u0645\u0627\u0621 \u0639\u0646\u062F \u062A\u0628\u0631\u064A\u062F\u0647.","\u0627\u0644\u0633\u062E\u0627\u0645 (C): \u062C\u0633\u064A\u0645\u0627\u062A \u0635\u0644\u0628\u0629 \u0633\u0648\u062F\u0627\u0621 \u062F\u0642\u064A\u0642\u0629 \u062A\u0646\u062A\u062C \u0645\u0646 \u0627\u0644\u0627\u062D\u062A\u0631\u0627\u0642 \u063A\u064A\u0631 \u0627\u0644\u062A\u0627\u0645 \u0644\u0644\u0647\u064A\u062F\u0631\u0648\u0643\u0631\u0628\u0648\u0646\u0627\u062A \u0648\u062A\u062A\u0631\u0633\u0628 \u0639\u0644\u0649 \u0627\u0644\u0623\u0633\u0637\u062D.","\u062B\u0627\u0646\u064A \u0623\u0643\u0633\u064A\u062F \u0627\u0644\u0643\u0628\u0631\u064A\u062A (SO2): \u064A\u0646\u062A\u062C \u0639\u0646\u062F \u0627\u062D\u062A\u0631\u0627\u0642 \u0648\u0642\u0648\u062F \u064A\u062D\u062A\u0648\u064A \u0639\u0644\u0649 \u0643\u0628\u0631\u064A\u062A\u061B \u063A\u0627\u0632 \u0639\u062F\u064A\u0645 \u0627\u0644\u0644\u0648\u0646 \u062E\u0627\u0646\u0642 \u0627\u0644\u0631\u0627\u0626\u062D\u0629\u060C \u064A\u0630\u0648\u0628 \u0641\u064A \u0627\u0644\u0645\u0627\u0621 \u0645\u0643\u0648\u0651\u0646\u0627 \u062D\u0645\u0636 \u0627\u0644\u0643\u0628\u0631\u064A\u062A\u0648\u0632 (H2SO3).","\u0623\u0643\u0627\u0633\u064A\u062F \u0627\u0644\u0646\u064A\u062A\u0631\u0648\u062C\u064A\u0646 (NOx): \u062A\u0646\u062A\u062C \u0623\u0633\u0627\u0633\u0627 \u0645\u0646 \u0627\u062D\u062A\u0631\u0627\u0642 \u0645\u0631\u0643\u0628\u0627\u062A \u0627\u0644\u0646\u064A\u062A\u0631\u0648\u062C\u064A\u0646 \u0641\u064A \u0627\u0644\u0648\u0642\u0648\u062F \u0627\u0644\u0623\u062D\u0641\u0648\u0631\u064A. \u0623\u0648\u0644 \u0623\u0643\u0633\u064A\u062F \u0627\u0644\u0646\u064A\u062A\u0631\u0648\u062C\u064A\u0646 (NO) \u063A\u0627\u0632 \u0639\u062F\u064A\u0645 \u0627\u0644\u0644\u0648\u0646 \u064A\u062A\u0641\u0627\u0639\u0644 \u0628\u0633\u0631\u0639\u0629 \u0645\u0639 \u0623\u0643\u0633\u062C\u064A\u0646 \u0627\u0644\u0647\u0648\u0627\u0621 \u0645\u0643\u0648\u0651\u0646\u0627 \u062B\u0627\u0646\u064A \u0623\u0643\u0633\u064A\u062F \u0627\u0644\u0646\u064A\u062A\u0631\u0648\u062C\u064A\u0646 (NO2) \u0648\u0647\u0648 \u063A\u0627\u0632 \u0628\u0646\u064A \u0645\u062D\u0645\u0631 \u062E\u0627\u0646\u0642 \u0627\u0644\u0631\u0627\u0626\u062D\u0629\u060C \u064A\u0630\u0648\u0628 \u0641\u064A \u0627\u0644\u0645\u0627\u0621 \u0645\u0643\u0648\u0651\u0646\u0627 \u062D\u0645\u0636 \u0627\u0644\u0646\u064A\u062A\u0631\u0648\u0632 (HNO2) \u0648\u062D\u0645\u0636 \u0627\u0644\u0646\u064A\u062A\u0631\u064A\u0643 (HNO3)."]}],quickChecks:[{q:"\u0627\u0644\u063A\u0627\u0632 \u0627\u0644\u0628\u0646\u064A \u0627\u0644\u0645\u062D\u0645\u0631 \u062E\u0627\u0646\u0642 \u0627\u0644\u0631\u0627\u0626\u062D\u0629 \u0647\u0648...",options:["NO","NO2","CO","CO2"],answer:1}]},{heading:"\u062A\u0641\u0627\u0639\u0644\u0627\u062A \u0627\u0644\u0627\u062D\u062A\u0631\u0627\u0642 \u0648\u062A\u0644\u0648\u062B \u0627\u0644\u0628\u064A\u0626\u0629",blocks:[{kind:"p",text:"\u062D\u0631\u0642 u0645\u0636\u064A\u0629 (\u062A\u062D\u0648\u0651\u0644\u0647\u0627 \u0644\u0644\u0623\u062D\u0645\u0631).","\u0627\u0644\u0627\u062D\u062A\u0631\u0627\u0642 \u0627\u0644\u062A\u0627\u0645 (\u0623\u0643\u0633\u062C\u064A\u0646 \u0648\u0641\u064A\u0631): CO2 + \u0628\u062E\u0627\u0631 \u0645\u0627\u0621 + \u062D\u0631\u0627\u0631\u0629 \u0643\u0628\u064A\u0631\u0629. \u063A\u064A\u0631 \u0627\u0644\u062A\u0627\u0645 (\u0623\u0643\u0633\u062C\u064A\u0646 \u0642\u0644\u064A\u0644): CO \u0623\u0648 \u0633\u062E\u0627\u0645 + \u0628\u062E\u0627\u0631 \u0645\u0627\u0621 + \u062D\u0631\u0627\u0631\u0629 \u0623\u0642\u0644.","\u0627\u0644\u0644\u0647\u0628 \u0627\u0644\u0623\u0632\u0631\u0642 = \u0627\u062D\u062A\u0631\u0627\u0642 \u062A\u0627\u0645\u061B \u0627\u0644\u0644\u0647\u0628 \u0627\u0644\u0623\u0635\u0641\u0631 = \u0627\u062D\u062A\u0631\u0627\u0642 \u063A\u064A\u0631 \u062A\u0627\u0645 (\u0633\u062E\u0627\u0645 \u0648CO).","\u0627\u0644\u0643\u0634\u0641 \u0639\u0646 \u0627\u0644\u0645\u0627\u0621 \u0628\u0648\u0631\u0642\u0629 \u0643\u0644\u0648\u0631\u064A\u062F \u0627\u0644\u0643\u0648\u0628\u0627\u0644\u062A (\u0645\u0646 \u0627\u0644\u0623\u0632\u0631\u0642 \u0644\u0644\u0648\u0631\u062F\u064A)\u061B \u0648\u0639\u0646 CO2 \u0628\u062A\u0639\u0643\u064A\u0631 \u0645\u0627\u0621 \u0627\u0644\u062C\u064A\u0631.","\u0627\u0644\u0646\u0648\u0627\u062A\u062C: CO2 \u0648CO (\u0633\u0627\u0645) \u0648\u0628\u062E\u0627\u0631 \u0627\u0644\u0645\u0627\u0621 \u0648\u0627\u0644\u0633\u062E\u0627\u0645 \u0648SO2 (\u062E\u0627\u0646\u0642\u060C \u064A\u0643\u0648\u0651\u0646 \u062D\u0645\u0636 \u0627\u0644\u0643\u0628\u0631\u064A\u062A\u0648\u0632) \u0648NOx (\u062B\u0627\u0646\u064A \u0623\u0643\u0633\u064A\u062F \u0627\u0644\u0646\u064A\u062A\u0631\u0648\u062C\u064A\u0646 \u0628\u0646\u064A \u0645\u062D\u0645\u0631).","\u0627\u0644\u0633\u062D\u0627\u0628\u0629 \u0627\u0644\u0633\u0648\u062F\u0627\u0621 \u0645\u0646 \u062D\u0631\u0642 \u0642\u0634 \u0627\u0644\u0623\u
