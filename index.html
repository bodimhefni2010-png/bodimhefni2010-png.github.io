. Flammable substances such as gasoline and alcohol are classified as highly flammable materials, and warning signs are placed on their containers."},{kind:"warn",text:"Safety: wear goggles and heat-resistant gloves, work on a stable heat-resistant surface away from flammable materials, and keep a fire extinguisher available."}],quickChecks:[{q:"The fire triangle consists of fuel, heat energy and ...",options:["Nitrogen","Oxygen","Carbon dioxide","Hydrogen"],answer:1}]},{heading:"2. Life application: ignition of a matchstick",blocks:[{kind:"bullets",items:["The matchstick head contains an oxidizing agent such as potassium chlorate (KClO3) and rapidly flammable substances, plus adhesives and glass powder or sand.","The side of the matchbox contains red phosphorus, adhesives and glass powder or sand.","Friction heat converts a tiny amount of red phosphorus into white phosphorus, which ignites spontaneously in air.","The heat decomposes potassium chlorate into potassium chloride (KCl) and oxygen (O2), which helps the matchstick head and wood burn more intensely and rapidly."]}],quickChecks:[{q:"The matchbox side contains ...",options:["Potassium chlorate","Red phosphorus","White phosphorus","Magnesium"],answer:1}]},{heading:"3. What is combustion?",blocks:[{kind:"def",text:"Combustion: a chemical reaction between a substance and oxygen that releases heat, light, or both, and produces new substances that vary according to the type of substance burned."},{kind:"p",text:"Combustion of metals: magnesium burns with a bright white light, forming a white powder of magnesium oxide."},{kind:"eq",text:"2Mg + O2 -> 2MgO (white powder)"},{kind:"bullets",items:["Most metals burn and produce metal oxides that are basic.","Some of these oxides dissolve in water, forming alkaline solutions which turn litmus blue."]}],quickChecks:[{q:"A solution of magnesium oxide in water turns litmus ...",options:["Red","Blue","Colourless","Green"],answer:1}]},{heading:"4. Combustion of nonmetals",blocks:[{kind:"p",text:"Coal (carbon) glows when it burns, and carbon dioxide gas evolves."},{kind:"eq",text:"C + O2 -> CO2"},{kind:"bullets",items:["Most nonmetals burn and produce nonmetal oxides that are acidic.","Most of these oxides dissolve in water, forming acids which turn litmus red."]}],quickChecks:[{q:"Most nonmetal oxides are ...",options:["Basic","Acidic","Neutral","Metallic"],answer:1}]},{heading:"5. Complete and incomplete combustion",blocks:[{kind:"info",text:"Hydrocarbons are compounds composed mainly of hydrogen and carbon. Natural gas is mainly methane (CH4), while butagas is mostly propane and butane."},{kind:"p",text:"In an experiment with a Bunsen burner: with the air valve fully open the flame is blue and the bottom of a test tube stays completely clean; with the valve partially closed the flame turns yellow and a black powder of unburned carbon (soot) forms on the tube."},{kind:"def",text:"Complete combustion of hydrocarbon gases occurs in an abundant supply of oxygen, producing carbon dioxide and water vapor in addition to a large amount of heat energy."},{kind:"eq",text:"CH4 + 2O2 -> CO2 + 2H2O + heat   (complete)"},{kind:"def",text:"Incomplete combustion occurs when there is not enough oxygen. Depending on the oxygen available, methane may produce carbon monoxide and water vapor, or soot (carbon) and water vapor."},{kind:"eq",text:"2CH4 + 3O2 -> 2CO + 4H2O + heat"},{kind:"eq",text:"CH4 + O2 -> C + 2H2O + heat   (soot)"},{kind:"warn",text:"Incomplete combustion of a given mass of fuel releases less thermal energy than complete combustion of the same mass."},{kind:"info",text:"Flame colour and heating efficiency: a blue stove flame means complete combustion (CO2 + water vapor + much heat, faster cooking, less gas). A yellow or orange flame means incomplete combustion: toxic carbon monoxide and black soot on cookware, and lower efficiency. Clean the flame openings or adjust the air intake."}],quickChecks:[{q:"Complete combustion of methane produces carbon dioxide and ...",options:["Carbon monoxide","Water vapor","Soot","Hydrogen"],answer:1},{q:"The yellow Bunsen flame indicates ...",options:["Complete combustion","Enough oxygen","Incomplete combustion","Absence of fuel"],answer:2}]},{heading:"6. Detecting the products of combustion",blocks:[{kind:"p",text:"When natural gas burns and its products pass through an apparatus: the ice around the U-shaped tube condenses the water vapor, and the resulting water changes anhydrous cobalt chloride paper from pale blue to pink. The clear limewater turns turbid because of carbon dioxide gas."},{kind:"bullets",items:["Water detection: anhydrous cobalt chloride paper changes from pale blue to pink.","Carbon dioxide detection: clear limewater turns turbid (milky)."]}],quickChecks:[{q:"Anhydrous cobalt chloride paper changes from pale blue to pink in the presence of ...",options:["CO2","H2O","CO","NO2"],answer:1}]},{heading:"7. Properties of combustion products",blocks:[{kind:"p",text:"Combustion products vary according to the chemical composition of the burned substance and the amount of oxygen available:"},{kind:"bullets",items:["Carbon dioxide (CO2): from complete combustion of carbon-containing materials; a colourless, odourless gas that does not burn or support combustion; heavier than air; dissolves in water forming carbonic acid (H2CO3).","Carbon monoxide (CO): from incomplete combustion when oxygen is lacking; a toxic colourless, odourless gas.","Water vapor (H2O): from combustion of hydrogen and hydrogen-containing materials; condenses into droplets when cooled.","Soot (C): fine black solid particles from incomplete combustion of hydrocarbons; deposits on surfaces.","Sulphur dioxide (SO2): from burning fuel containing sulphur; a colourless gas with a choking odour; dissolves in water forming sulphurous acid (H2SO3).","Nitrogen oxides (NOx): from combustion of nitrogen-containing compounds in fossil fuel. Nitric oxide (NO) is colourless and reacts rapidly with atmospheric oxygen forming nitrogen dioxide (NO2), a reddish-brown gas with a pungent, choking odour that dissolves in water forming nitrous acid (HNO2) and nitric acid (HNO3)."]}],quickChecks:[{q:"The reddish-brown gas with a pungent odour is ...",options:["NO","NO2","CO","CO2"],answer:1}]},{heading:"8. Combustion and environmental pollution",blocks:[{kind:"p",text:"Burning agricultural wastes: some farmers burn rice straw in fields at the end of the harvest season (usually October and November). Because it is piled up, oxygen cannot pass through, so it undergoes incomplete combustion, releasing large amounts of carbon monoxide, carbon dioxide and suspended soot particles, forming the dense smoke known as the black cloud. The black cloud reduces visibility, causes breathing difficulty, and increases asthma and chest allergy cases."},{kind:"p",text:"Car exhaust: burning fuel inside a car engine produces a mixture of emissions known as exhaust: carbon monoxide, carbon dioxide, soot and nitrogen oxides. It is one of the main causes of air pollution in cities. Incomplete combustion (too little air or low engine efficiency) increases the harmful emissions."},{kind:"bullets",items:["Reducing car exhaust pollution: regular engine maintenance; cleaner fuels such as natural gas or electric cars; eco-friendly public transportation.","Catalytic converter: catalysts (substances that increase the rate of a chemical reaction without being changed) speed up redox reactions in the exhaust, converting toxic gases such as carbon monoxide and nitrogen oxides into safer substances such as carbon dioxide and nitrogen."]},{kind:"p",text:"Industry: combustion is a main energy source in metal smelting, ceramic, cement and glass manufacturing and petroleum distillation, and many power plants burn fossil fuels to produce steam that drives turbines and electric generators."},{kind:"bullets",items:["Reducing industrial pollution: using natural gas as a fuel; installing filters to purify gases before they leave chimneys; using renewable energy such as solar and wind.","Acid gas scrubbers: toxic acidic gases such as sulphur dioxide pass through a spray of alkaline solutions in the chimneys; neutralization reactions produce safe precipitated salts, reducing acid rain and smog."]},{kind:"info",text:"Why is natural gas preferred to coal? Natural gas produces low carbon dioxide emissions and very low sulphur oxide and carbon particle emissions, while coal produces a very high proportion of carbon dioxide and greater amounts of sulphur oxides and carbon particles."},{kind:"info",text:"Law of conservation of matter: in combustion reactions the composition of the reactants changes, but the total mass of the products equals the total mass of the reactants."}],quickChecks:[{q:"The black cloud is mainly caused by burning ...",options:["Natural gas","Rice straw","Coal in factories","Wood in stoves"],answer:1},{q:"The catalytic converter converts carbon monoxide and nitrogen oxides into ...",options:["CO2 and nitrogen","SO2 and water","Soot and CO2","Oxygen and hydrogen"],answer:0}]},{heading:"Lesson summary",blocks:[{kind:"bullets",items:["Fire triangle: fuel + oxygen + heat energy. Combustion starts at the ignition point.","Combustion: a chemical reaction with oxygen releasing heat, light or both.","Metals burn giving basic metal oxides (turn litmus blue in water); nonmetals burn giving acidic oxides (turn litmus red).","Complete combustion (abundant O2): CO2 + H2O + much heat. Incomplete combustion (little O2): CO or soot + H2O + less heat.","Blue flame = complete combustion; yellow flame = incomplete combustion (soot and CO).","Water is detected with cobalt chloride paper (blue to pink); CO2 turns limewater turbid.","Products: CO2, CO (toxic), H2O vapor, soot, SO2 (choking, forms sulphurous acid), NOx (NO2 is reddish-brown, forms nitrous and nitric acids).","Black cloud from burning rice straw; car exhaust is a main cause of city air pollution.","Solutions: catalytic converter (cars), acid gas scrubbers (factories), natural gas instead of coal, filters, renewable energy."]}],quickChecks:[]}],Cg=[{t:"GiveReason",q:"Give reason: A wet paper strip does not catch fire as easily as a dry one.",a:"Because water absorbs heat, which delays the wet paper from reaching its ignition point.",k:"water,absorb,ignition"},{t:"GiveReason",q:"Give reason: Warning signs are placed on containers of gasoline and alcohol.",a:"Because they are highly flammable materials that ignite easily and quickly at the surrounding temperature.",k:"flammab,ignite|fire|hazard|danger"},{t:"GiveReason",q:"Give reason: A matchstick ignites when rubbed against the side of its box.",a:"Friction heat converts red phosphorus into white phosphorus which ignites spontaneously, and the heat decomposes potassium chlorate producing oxygen that helps the head burn.",k:"friction|heat,phosphorus,oxygen|chlorate"},{t:"GiveReason",q:"Give reason: The solution of magnesium oxide in water turns litmus blue.",a:"Because metal oxides are basic and dissolve in water forming alkaline solutions.",k:"basic|alkaline|alkali,metal oxide|oxide"},{t:"GiveReason",q:"Give reason: A black powder forms on the bottom of a test tube exposed to the yellow Bunsen flame, while the blue flame leaves it clean.",a:"The yellow flame is incomplete combustion (less oxygen) which produces soot, while the blue flame is complete combustion.",k:"incomplete,soot|carbon,complete"},{t:"GiveReason",q:"Give reason: Incomplete combustion of a fuel is economically inefficient.",a:"Because it releases less thermal energy than complete combustion of the same mass of fuel.",k:"less,energy|heat"},{t:"GiveReason",q:"Give reason: Ice is placed around the U-shaped tube when detecting combustion products.",a:"To condense the water vapor produced by combustion into liquid water.",k:"condens,water vapor|water vapour|vapor|vapour"},{t:"GiveReason",q:"Give reason: The black cloud forms when farmers burn rice straw in fields.",a:"The piled straw undergoes incomplete combustion because oxygen cannot pass through, releasing carbon monoxide, carbon dioxide and soot as dense smoke.",k:"rice straw|straw,incomplete|pile|oxygen,soot|smoke|carbon"},{t:"GiveReason",q:"Give reason: Natural gas is preferred to coal as a source of heat energy.",a:"Its combustion is less harmful: low carbon dioxide emissions and very low sulphur oxides and carbon particles, unlike coal.",k:"less|low|lower,pollution|emission|sulphur|sulfur|carbon"},{t:"GiveReason",q:"Give reason: Catalytic converters reduce the environmental harm of car exhaust.",a:"Catalysts speed up redox reactions that convert toxic carbon monoxide and nitrogen oxides into safer carbon dioxide and nitrogen.",k:"catalyst,carbon monoxide,nitrogen"},{t:"WhatHappens",q:"What happens when: A dry paper strip is held about 2 cm above a candle flame?",a:"It catches fire after reaching its ignition point.",k:"catch|ignite|burn|fire,ignition"},{t:"WhatHappens",q:"What happens when: A sanded magnesium ribbon is heated in a Bunsen flame? (write the equation)",a:"It burns with a bright white light forming a white powder of magnesium oxide: 2Mg + O2 -> 2MgO.",k:"white,light|flame|bright,magnesium oxide|mgo"},{t:"WhatHappens",q:"What happens when: A piece of coal is heated in a Bunsen flame? (write the equation)",a:"It glows and carbon dioxide gas evolves: C + O2 -> CO2.",k:"glow,carbon dioxide|co2"},{t:"WhatHappens",q:"What happens when: The products of burning natural gas pass over anhydrous cobalt chloride paper?",a:"The paper changes from pale blue to pink because water vapor condenses into water.",k:"blue,pink,water"},{t:"WhatHappens",q:"What happens when: The products of complete combustion of natural gas bubble through clear limewater?",a:"The limewater turns turbid (milky) because of carbon dioxide gas.",k:"turbid|milky|cloudy,carbon dioxide|co2"},{t:"Compare",q:"Compare: Complete and incomplete combustion of methane (oxygen - products - energy).",a:"Complete: abundant oxygen, CO2 + water vapor, large heat energy. Incomplete: insufficient oxygen, CO or soot + water vapor, less energy.",k:"oxygen,carbon dioxide|co2,carbon monoxide|soot|co,less|more"},{t:"Compare",q:"Compare: The blue flame and the yellow flame of a Bunsen burner (air valve - type of combustion - effect on a test tube).",a:"Blue: valve open, more oxygen, complete combustion, tube stays clean. Yellow: valve partially closed, less oxygen, incomplete combustion, soot deposits on the tube.",k:"open|oxygen,complete,incomplete,soot|clean"},{t:"Compare",q:"Compare: Combustion of magnesium and combustion of coal (type of element - nature of oxide - effect on litmus).",a:"Magnesium is a metal; its oxide is basic and its solution turns litmus blue. Carbon is a nonmetal; its oxide is acidic and its solution turns litmus red.",k:"metal,basic|alkaline|blue,nonmetal|non-metal,acidic|acid|red"},{t:"Compare",q:"Compare: The catalytic converter in cars and the acid gas scrubber in factories (purpose - method - gases treated).",a:"Catalytic converter: in car exhaust, catalysts speed redox reactions converting CO and nitrogen oxides to CO2 and nitrogen. Scrubber: in factory chimneys, alkaline sprays neutralize acidic gases such as SO2 into safe salts.",k:"car|exhaust,catalyst|redox,factory|chimney|industr,alkaline|neutrali|sulphur|sulfur"},{t:"Compare",q:"Compare: Natural gas and coal as fuels (environmental emissions).",a:"Natural gas: low CO2 emissions and very low sulphur oxides and carbon particles. Coal: very high CO2 and greater amounts of sulphur oxides and carbon particles.",k:"less|low|lower,carbon dioxide|co2,sulphur|sulfur,particle|soot"},{t:"MCQ",q:"The fire triangle consists of fuel, heat energy and ...",o:["Nitrogen","Oxygen","Carbon dioxide","Hydrogen"],c:1,a:"Combustion needs fuel, oxygen and heat energy."},{t:"MCQ",q:"The matchstick head contains ...",o:["Mercury oxide and glass powder","Potassium chlorate and flammable substances","Red phosphorus and sulphur","Carbon and sand"],c:1,a:"The head contains an oxidizing agent such as potassium chlorate; the box side contains red phosphorus."},{t:"MCQ",q:"Anhydrous cobalt chloride paper changes from blue to pink in the presence of ...",o:["H2O","NO2","CO2","CO"],c:0,a:"It detects the water produced by combustion."},{t:"MCQ",q:"The reddish-brown gas with a pungent odour produced by combustion of impurities in fossil fuel is ...",o:["Nitric oxide","Carbon monoxide","Sulphur dioxide","Nitrogen dioxide"],c:3,a:"NO is colourless; it reacts with oxygen forming reddish-brown NO2."},{t:"MCQ",q:"The gas that turns limewater turbid when methane burns completely is ...",o:["CO","CO2","SO2","NO2"],c:1,a:"Complete combustion of methane produces CO2 and water vapor."},{t:"TF",q:"The ignition point is the highest temperature a material must reach to catch fire.",c:!1,a:"It is the LOWEST temperature at which the material catches fire and keeps burning spontaneously.",k:"lowest"},{t:"TF",q:"Most nonmetal oxides are acidic and their aqueous solutions turn litmus red.",c:!0,a:"",k:""},{t:"TF",q:"Incomplete combustion of methane may produce carbon monoxide or soot.",c:!0,a:"",k:""},{t:"TF",q:"Carbon monoxide is a coloured gas with a strong odour.",c:!1,a:"Carbon monoxide is a COLOURLESS, ODOURLESS toxic gas.",k:"colourless|colorless,odourless|odorless"},{t:"TF",q:"Acid gas scrubbers pass the acidic gases through a spray of acidic solutions.",c:!1,a:"They use ALKALINE solutions, so neutralization produces safe salts.",k:"alkaline|base|basic"}],Ng=[{t:"MCQ",q:"Why does the percentage of harmful gases in car exhaust increase when the engine is not properly maintained?",o:["The fuel does not burn completely","The fuel combustion rate increases","The engine temperature decreases","Water vapor condenses inside the engine"],c:0,a:"Poor maintenance lowers engine efficiency, so combustion becomes incomplete and emissions increase."},{t:"MCQ",q:"How many oxygen molecules are needed for the complete combustion of 4 methane molecules?",o:["4","2","6","8"],c:3,a:"CH4 + 2O2 -> CO2 + 2H2O: each methane needs 2 oxygen molecules, so 4 x 2 = 8."},{t:"TF",q:"Combustion is a physical change in the state of matter.",c:!1,a:"Combustion is a CHEMICAL reaction between a substance and oxygen that releases heat and light and produces new substances.",k:"chemical"},{t:"GiveReason",q:"Give reason: Carbon monoxide is considered dangerous to humans.",a:"Because it is a toxic gas produced by incomplete combustion; it binds to blood hemoglobin much faster than oxygen, reducing the oxygen carried in the blood.",k:"toxic|poison,hemoglobin|haemoglobin|blood,oxygen"},{t:"MCQ",q:"Sulphur dioxide gas dissolves in water forming ...",o:["Sulphuric acid","Sulphurous acid","Carbonic acid","Nitric acid"],c:1,a:"SO2 + H2O -> H2SO3 (sulphurous acid)."},{t:"TF",q:"Flammability expresses how easily and quickly a material ignites at the surrounding temperature.",c:!0,a:"",k:""},{t:"MCQ",q:"The black powder that deposits on cookware above a yellow flame is ...",o:["Ash","Soot (carbon)","Sulphur","Metal oxide"],c:1,a:"Incomplete combustion of hydrocarbons produces soot, fine black carbon particles."},{t:"GiveReason",q:"Give reason: Black soot is produced when a candle burns in a small amount of oxygen.",a:"Because the combustion is incomplete when oxygen is insufficient, so unburned carbon (soot) is produced.",k:"incomplete,oxygen,carbon|soot"}],qh={id:"u1l2",unit:1,title:"Combustion Reactions and Environmental Pollution",subtitle:"Unit 1 - Lesson 2",readSeconds:120,examMinutes:150,unlockCode:"video2",sections:bg,questions:Cg,homework:Ng},Sg=[{heading:"1. Tobacco and its combustion products",blocks:[{kind:"p",text:"The tobacco plant grows mainly in warm tropical regions; it has a thick upright stem, large green leaves and tubular flowers that may be white, pink or red."},{kind:"p",text:"In a well-known experiment, cigarette smoke is drawn through a piece of white cotton packed into the mouth of a bottle. The cotton changes colour from white to dark or brown as some combustion products deposit among its fibers."}],quickChecks:[{q:"In the tobacco combustion experiment, the white cotton turns ...",options:["Blue","Dark or brown","Pink","Green"],answer:1}]},{heading:"2. What does tobacco contain?",blocks:[{kind:"def",text:"Nicotine: a natural organic compound containing carbon, hydrogen and nitrogen, with an alkaline effect. The high temperature of a lit cigarette vaporizes nicotine into a gas that mixes with the smoke and is inhaled by the smoker."},{kind:"bullets",items:["Toxic gases: carbon monoxide (CO) and hydrogen cyanide (HCN).","Gases that irritate the respiratory system: nitrogen oxides (NO and NO2) and ammonia (NH3).","Carbohydrates and proteins in tobacco leaves produce, when burned, carbon monoxide and tar: a viscous liquid made of the combustion products of sugars, plant proteins and fibers.","Mineral elements: potassium, magnesium and calcium, plus toxic heavy elements, most importantly cadmium, lead and arsenic.","Radioactive elements: small amounts such as polonium-210 can cause radiation damage to the smoker's lungs."]}],quickChecks:[{q:"The substance in tobacco that causes addiction is ...",options:["Tar","Nicotine","Water vapor","Ash"],answer:1}]},{heading:"3. What happens to mineral and radioactive elements during smoking?",blocks:[{kind:"bullets",items:["Volatilization: some heavy metals and radioactive elements vaporize when tobacco ignites, becoming gases or adhering to fine tar particles.","Inhalation: radioactive atoms enter the lungs and deposit in the bronchi branches.","Radioactive accumulation: the accumulated radioactive elements cause DNA damage in lung cells, increasing the risk of cancerous tumors.","Ash: the residual ash contains nonvolatile minerals such as calcium and potassium, which give the ash its white or gray colour."]}],quickChecks:[{q:"The radioactive element that leaks into the lungs during smoking is ...",options:["Cadmium","Lead","Polonium-210","Arsenic"],answer:2}]},{heading:"4. Health hazards: the respiratory system",blocks:[{kind:"p",text:"According to the World Health Organization (WHO) and the Egyptian Ministry of Health, smoking causes more than 8 million deaths worldwide every year. Once tobacco burns, complex reactions produce several thousand chemicals, most of them toxic gases and carcinogenic substances."},{kind:"p",text:"Smoking changes the lungs from their normal pink colour to a dark or black colour because tar and fine chemical particles deposit within the lung tissues. Over time the lungs lose their elasticity and their capacity gradually decreases, so smokers suffer from chronic shortness of breath, continuous coughing and a decline in physical activity, with an increased risk of lung cancer."},{kind:"def",text:"Emphysema: inhaled tar condenses and deposits on the inner walls of the alveoli; the lung tissue loses its elasticity, the alveoli walls rupture and change from numerous small sacs into large sagging cavities. The surface area for gas exchange decreases greatly, so less oxygen reaches the blood and the patient suffers severe, chronic difficulty breathing."},{kind:"info",text:"Structure and function: alveoli are small, thin-walled and numerous (structure), providing a large surface area for gas exchange between lungs and blood (function)."}],quickChecks:[{q:"The walls of the alveoli are damaged and the gas-exchange surface decreases due to the accumulation of ...",options:["Nicotine","Tar","Lead","Ash"],answer:1}]},{heading:"5. Health hazards: heart, nerves and more",blocks:[{kind:"bullets",items:["Circulatory system: carbon monoxide binds to blood hemoglobin much faster than oxygen, reducing the oxygen carried in the blood. Nicotine increases heart rate, raises blood pressure and constricts blood vessels, increasing the risk of heart disease and atherosclerosis.","Nervous system and senses: toxins cause disorders; nicotine may increase anxiety and cause sleep and vision disorders, and may affect brain function and concentration, especially in adolescents.","Fertility and reproductive health: smoking negatively affects fertility in both genders and increases the risk of fetal abnormalities.","Immune system and appearance: smoking weakens immunity; its effects appear as pale skin and hair loss."]},{kind:"p",text:"Why is smoking addictive? Nicotine quickly reaches the brain and stimulates the secretion of substances that cause a temporary feeling of well-being. The effect fades quickly, creating a craving for another cigarette; repeated smoking leads to addiction, a harmful habit that is difficult to quit."}],quickChecks:[{q:"The gas that reduces the blood's ability to carry oxygen is ...",options:["Carbon dioxide","Nitrogen","Carbon monoxide","Oxygen"],answer:2}]},{heading:"6. Smoking and the environment",blocks:[{kind:"bullets",items:["Air pollution: large amounts of carbon dioxide produced by smoking are released into the atmosphere, further contributing to global warming. (WHO: smoking releases tens of millions of tons of CO2 into the atmosphere.)","Water and soil pollution: cigarette butts are among the most widespread forms of litter; they contain harmful chemicals that leach into soil and water and affect living organisms. (WHO: several trillion cigarette filters end up in oceans, rivers and on beaches every year.)"]}],quickChecks:[{q:"Cigarette butts pollute ...",options:["Air only","Water and soil","Only oceans","Nothing"],answer:1}]},{heading:"7. Types of smoking and forms of exposure",blocks:[{kind:"def",text:"Traditional smoking relies on burning the tobacco leaves in cigarettes. Vaping (e-smoking) relies on heating a nicotine-containing liquid with an electronic device."},{kind:"warn",text:"A common misconception says vaping is less harmful than traditional smoking. In fact both cause severe, direct damage to the lungs and heart, and the high nicotine concentration in vaping causes rapid addiction and may lead to acute disorders of heart and nervous system functions."},{kind:"def",text:"Active smoking: the smoker deliberately inhales smoke from burning tobacco or aerosol from vaping devices into the lungs. Passive smoking: non-smokers inhale smoke exhaled by a smoker or released from the burning tip of a cigarette; this smoke contains higher concentrations of toxic and carcinogenic gases because it has not passed through the cigarette filter, so non-smokers risk the same heart and respiratory diseases."},{kind:"p",text:'Prevention: decide to refuse and say "No"; choose positive friends; keep yourself engaged in sport, reading and hobbies; avoid smoking areas to protect yourself from passive smoking; ask a parent or teacher for help when pressured; learn about the harmful effects of smoking.'}],quickChecks:[{q:"Passive smoking is dangerous to non-smokers because the smoke they inhale ...",options:["Has passed through the filter","Has not passed through the filter and is more concentrated","Contains only water vapor","Is completely harmless"],answer:1}]},{heading:"Lesson summary",blocks:[{kind:"bullets",items:["Tobacco contains nicotine (addictive, alkaline organic compound), carbohydrates and proteins (produce tar), minerals, toxic heavy elements (cadmium, lead, arsenic) and radioactive polonium-210.","Tobacco combustion releases toxic gases (CO, HCN) and respiratory irritants (NOx, NH3).","Tar deposits in the lungs turning them dark, reducing elasticity and capacity, and may cause emphysema and lung cancer.","CO binds hemoglobin faster than oxygen; nicotine raises heart rate and blood pressure and constricts blood vessels.","Nicotine causes addiction: temporary well-being, then craving, then addiction.","Smoking pollutes air (CO2 and global warming), water and soil (cigarette butts).","Traditional smoking burns tobacco; vaping heats nicotine liquid; both severely damage lungs and heart.","Active smoking: deliberate inhalation; passive smoking: inhaling others' smoke, more concentrated and unfiltered."]}],quickChecks:[]}],Tg=[{t:"GiveReason",q:"Give reason: Smoking is a harmful habit that is difficult to quit.",a:"Nicotine reaches the brain quickly and stimulates substances that cause a temporary feeling of well-being; when the effect fades, the smoker craves another cigarette, and repetition leads to addiction.",k:"nicotine,well-being|well being|temporary|fades,addict|crav"},{t:"GiveReason",q:"Give reason: The lungs of a smoker change from pink to a dark or black colour.",a:"Because tar and fine chemical particles deposit within the lung tissues.",k:"tar,deposit|accumulat|particles"},{t:"GiveReason",q:"Give reason: A smoker suffers from chronic shortness of breath over time.",a:"Tar deposition makes the lungs lose elasticity and reduces their capacity, and emphysema may rupture the alveoli walls, decreasing the gas-exchange surface and the oxygen reaching the blood.",k:"tar|elastic|alveoli|emphysema,oxygen|capacity|surface"},{t:"GiveReason",q:"Give reason: Smoking reduces the amount of oxygen carried by the blood.",a:"Because carbon monoxide binds to blood hemoglobin much faster than oxygen does.",k:"carbon monoxide|co,hemoglobin|haemoglobin,faster|oxygen"},{t:"GiveReason",q:"Give reason: Vaping is not less harmful than traditional smoking.",a:"Both cause severe direct damage to the lungs and heart, and the high nicotine concentration in vaping causes rapid addiction and may cause acute heart and nervous system disorders.",k:"damage|harm|severe,lung|heart,nicotine|addict"},{t:"GiveReason",q:"Give reason: Passive smoking is dangerous to non-smokers.",a:"The smoke they inhale has not passed through the cigarette filter, so it contains higher concentrations of toxic and carcinogenic gases, exposing them to the same heart and respiratory diseases.",k:"filter,higher|concentrat|more,toxic|carcinogenic"},{t:"GiveReason",q:"Give reason: The residual cigarette ash has a white or gray colour.",a:"Because it contains nonvolatile minerals s : \u0639\u062F\u062F\u0647\u0627 \u0641\u064A \u0648\u062D\u062F\u0629 \u0627\u0644\u0632\u0645\u0646 \u0647\u0648 \u0634\u062F\u0629 \u0627\u0644\u062A\u064A\u0627\u0631."]),M(["Electric current intensity (I): the quantity of electric charge that passes through a cross-section of a conductor per second.","\u0634\u062F\u0629 \u0627\u0644\u062A\u064A\u0627\u0631 \u0627\u0644\u0643\u0647\u0631\u0628\u064A (I): \u0643\u0645\u064A\u0629 \u0627\u0644\u0634\u062D\u0646\u0629 \u0627\u0644\u0643\u0647\u0631\u0628\u064A\u0629 \u0627\u0644\u062A\u064A \u062A\u0645\u0631 \u0641\u064A \u0645\u0642\u0637\u0639 \u0627\u0644\u0645\u0648\u0635\u0644 \u0641\u064A \u0627\u0644\u062B\u0627\u0646\u064A\u0629 \u0627\u0644\u0648\u0627\u062D\u062F\u0629."]),Ke("I = Q / t"),L(["Q is the charge in coulombs (C), t is the time in seconds (s), and I is measured in amperes (A). 1 A = 1 C/s.","Q \u0627\u0644\u0634\u062D\u0646\u0629 \u0628\u0627\u0644\u0643\u0648\u0644\u0648\u0645 (C)\u060C \u0648 t \u0627\u0644\u0632\u0645\u0646 \u0628\u0627\u0644\u062B\u0627\u0646\u064A\u0629 (s)\u060C \u0648 I \u062A\u0642\u0627\u0633 \u0628\u0627\u0644\u0623\u0645\u0628\u064A\u0631 (A). 1 \u0623\u0645\u0628\u064A\u0631 = 1 \u0643\u0648\u0644\u0648\u0645/\u062B\u0627\u0646\u064A\u0629."]),J(["The ammeter measures current intensity. It is connected IN SERIES with the component.","\u0627\u0644\u0623\u0645\u064A\u062A\u0631 \u064A\u0642\u064A\u0633 \u0634\u062F\u0629 \u0627\u0644\u062A\u064A\u0627\u0631 \u0648\u064A\u0648\u0635\u0644 \u0639\u0644\u0649 \u0627\u0644\u062A\u0648\u0627\u0644\u064A \u0645\u0639 \u0627\u0644\u062C\u0632\u0621 \u0627\u0644\u0645\u0631\u0627\u062F \u0642\u064A\u0627\u0633 \u0627\u0644\u062A\u064A\u0627\u0631 \u0641\u064A\u0647."]),he(["Example: 12 C pass through a wire in 4 s. I = 12 / 4 = 3 A.","\u0645\u062B\u0627\u0644: \u0645\u0631\u062A \u0634\u062D\u0646\u0629 12 \u0643\u0648\u0644\u0648\u0645 \u0641\u064A \u0633\u0644\u0643 \u062E\u0644\u0627\u0644 4 \u062B\u0648\u0627\u0646. I = 12 \xF7 4 = 3 \u0623\u0645\u0628\u064A\u0631."])],q(["The ammeter is connected ... with the component.","\u064A\u0648\u0635\u0644 \u0627\u0644\u0623\u0645\u064A\u062A\u0631 ... \u0645\u0639 \u0627\u0644\u062C\u0632\u0621 \u0627\u0644\u0645\u0631\u0627\u062F \u0627\u0644\u0642\u064A\u0627\u0633 \u0641\u064A\u0647."],[["In parallel","In series","Across the cell only","Without a circuit"],["\u0639\u0644\u0649 \u0627\u0644\u062A\u0648\u0627\u0632\u064A","\u0639\u0644\u0649 \u0627\u0644\u062A\u0648\u0627\u0644\u064A","\u0628\u064A\u0646 \u0637\u0631\u0641\u064A \u0627\u0644\u0639\u0645\u0648\u062F \u0641\u0642\u0637","\u0628\u062F\u0648\u0646 \u062F\u0627\u0626\u0631\u0629"]],1)),P(["3. Electric potential difference","3. \u0641\u0631\u0642 \u0627\u0644\u062C\u0647\u062F \u0627\u0644\u0643\u0647\u0631\u0628\u064A"],[L(["Water flows from container X to Y while the water levels differ. In the same way, charges flow from the point of higher potential to the point of lower potential. When the levels (potentials) become equal, the flow stops.","\u064A\u062A\u062F\u0641\u0642 \u0627\u0644\u0645\u0627\u0621 \u0645\u0646 \u0627\u0644\u0625\u0646\u0627\u0621 X \u0625\u0644\u0649 Y \u0645\u0627 \u062F\u0627\u0645 \u0645\u0633\u062A\u0648\u0649 \u0627\u0644\u0645\u0627\u0621 \u0645\u062E\u062A\u0644\u0641\u0627. \u0648\u0628\u0627\u0644\u0645\u062B\u0644 \u062A\u062A\u062F\u0641\u0642 \u0627\u0644\u0634\u062D\u0646\u0627\u062A \u0645\u0646 \u0646\u0642\u0637\u0629 \u062C\u0647\u062F\u0647\u0627 \u0623\u0639\u0644\u0649 \u0625\u0644\u0649 \u0646\u0642\u0637\u0629 \u062C\u0647\u062F\u0647\u0627 \u0623\u0642\u0644. \u0648\u0639\u0646\u062F\u0645\u0627 \u064A\u062A\u0633\u0627\u0648\u0649 \u0627\u0644\u062C\u0647\u062F\u0627\u0646 \u064A\u062A\u0648\u0642\u0641 \u0627\u0644\u062A\u062F\u0641\u0642."]),J(["By convention, the current flows from the positive pole (higher potential) to the negative pole (lower potential). The free electrons actually move the opposite way.","\u0627\u0635\u0637\u0644\u0627\u062D\u0627 \u064A\u0633\u0631\u064A \u0627\u0644\u062A\u064A\u0627\u0631 \u0645\u0646 \u0627\u0644\u0642\u0637\u0628 \u0627\u0644\u0645\u0648\u062C\u0628 (\u0627\u0644\u062C\u0647\u062F \u0627\u0644\u0623\u0639\u0644\u0649) \u0625\u0644\u0649 \u0627\u0644\u0642\u0637\u0628 \u0627\u0644\u0633\u0627\u0644\u0628 (\u0627\u0644\u062C\u0647\u062F \u0627\u0644\u0623\u0642\u0644). \u0623\u0645\u0627 \u0627\u0644\u0625\u0644\u0643\u062A\u0631\u0648\u0646\u0627\u062A \u0627\u0644\u062D\u0631\u0629 \u0641\u062A\u062A\u062D\u0631\u0643 \u0641\u0639\u0644\u064A\u0627 \u0641\u064A \u0627\u0644\u0627\u062A\u062C\u0627\u0647 \u0627\u0644\u0645\u0639\u0627\u0643\u0633."]),M(["Potential difference (V): the work done to move one coulomb of charge between two points.","\u0641\u0631\u0642 \u0627\u0644\u062C\u0647\u062F (V): \u0627\u0644\u0634\u063A\u0644 \u0627\u0644\u0645\u0628\u0630\u0648\u0644 \u0644\u0646\u0642\u0644 \u0634\u062D\u0646\u0629 \u0645\u0642\u062F\u0627\u0631\u0647\u0627 \u0643\u0648\u0644\u0648\u0645 \u0648\u0627\u062D\u062F \u0628\u064A\u0646 \u0646\u0642\u0637\u062A\u064A\u0646."]),Ke("V = W / Q"),L(["W is the work in joules (J), Q the charge in coulombs, and V is measured in volts (V). 1 V = 1 J/C.","W \u0627\u0644\u0634\u063A\u0644 \u0628\u0627\u0644\u062C\u0648\u0644 (J)\u060C \u0648 Q \u0627\u0644\u0634\u062D\u0646\u0629 \u0628\u0627\u0644\u0643\u0648\u0644\u0648\u0645\u060C \u0648 V \u062A\u0642\u0627\u0633 \u0628\u0627\u0644\u0641\u0648\u0644\u062A (V). 1 \u0641\u0648\u0644\u062A = 1 \u062C\u0648\u0644/\u0643\u0648\u0644\u0648\u0645."]),J(["The voltmeter measures potential difference. It is connected IN PARALLEL across the two points.","\u0627\u0644\u0641\u0648\u0644\u062A\u0645\u064A\u062A\u0631 \u064A\u0642\u064A\u0633 \u0641\u0631\u0642 \u0627\u0644\u062C\u0647\u062F \u0648\u064A\u0648\u0635\u0644 \u0639\u0644\u0649 \u0627\u0644\u062A\u0648\u0627\u0632\u064A \u0628\u064A\u0646 \u0627\u0644\u0646\u0642\u0637\u062A\u064A\u0646."]),he(["Example: 30 J of work move 5 C. V = 30 / 5 = 6 V.","\u0645\u062B\u0627\u0644: \u0634\u063A\u0644 30 \u062C\u0648\u0644 \u0644\u0646\u0642\u0644 \u0634\u062D\u0646\u0629 5 \u0643\u0648\u0644\u0648\u0645. V = 30 \xF7 5 = 6 \u0641\u0648\u0644\u062A."])],q(["The voltmeter is connected ... across two points.","\u064A\u0648\u0635\u0644 \u0627\u0644\u0641\u0648\u0644\u062A\u0645\u064A\u062A\u0631 ... \u0628\u064A\u0646 \u0646\u0642\u0637\u062A\u064A\u0646."],[["In series","In parallel","Beside the switch only","Inside the cell"],["\u0639\u0644\u0649 \u0627\u0644\u062A\u0648\u0627\u0644\u064A","\u0639\u0644\u0649 \u0627\u0644\u062A\u0648\u0627\u0632\u064A","\u0628\u062C\u0648\u0627\u0631 \u0627\u0644\u0645\u0641\u062A\u0627\u062D \u0641\u0642\u0637","\u062F\u0627\u062E\u0644 \u0627\u0644\u0639\u0645\u0648\u062F"]],1)),P(["4. Electric sources and electromotive force","4. \u0627\u0644\u0645\u0635\u0627\u062F\u0631 \u0627\u0644\u0643\u0647\u0631\u0628\u064A\u0629 \u0648\u0627\u0644\u0642\u0648\u0629 \u0627\u0644\u062F\u0627\u0641\u0639\u0629 \u0627\u0644\u0643\u0647\u0631\u0628\u064A\u0629"],[_([["Direct source (electric cell, battery): gives a direct current (DC) of constant intensity in one direction.","\u0645\u0635\u062F\u0631 \u0645\u0633\u062A\u0645\u0631 (\u0639\u0645\u0648\u062F \u0643\u0647\u0631\u0628\u064A\u060C \u0628\u0637\u0627\u0631\u064A\u0629): \u064A\u0639\u0637\u064A \u062A\u064A\u0627\u0631\u0627 \u0645\u0633\u062A\u0645\u0631\u0627 (DC) \u062B\u0627\u0628\u062A \u0627\u0644\u0634\u062F\u0629 \u0641\u064A \u0627\u062A\u062C\u0627\u0647 \u0648\u0627\u062D\u062F."],["Alternating source (AC generator): gives an alternating current (AC) whose value and direction change with time.","\u0645\u0635\u062F\u0631 \u0645\u062A\u0631\u062F\u062F (\u0645\u0648\u0644\u062F \u062A\u064A\u0627\u0631 \u0645\u062A\u0631\u062F\u062F): \u064A\u0639\u0637\u064A \u062A\u064A\u0627\u0631\u0627 \u0645\u062A\u062A\u0631\u062F\u062F\u0627 (AC) \u062A\u062A\u063A\u064A\u0631 \u0642\u064A\u0645\u062A\u0647 \u0648\u0627\u062A\u062C\u0627\u0647\u0647 \u0645\u0639 \u0627\u0644\u0632\u0645\u0646."]]),M(["Electromotive force (emf) of a source: the total work done by the source to move one coulomb of charge through the whole circuit. It is measured in volts.","\u0627\u0644\u0642\u0648\u0629 \u0627\u0644\u062F\u0627\u0641\u0639\u0629 \u0627\u0644\u0643\u0647\u0631\u0628\u064A\u0629 \u0644\u0644\u0645\u0635\u062F\u0631: \u0627\u0644\u0634\u063A\u0644 \u0627\u0644\u0643\u0644\u064A \u0627\u0644\u0630\u064A \u064A\u0628\u0630\u0644\u0647 \u0627\u0644\u0645\u0635\u062F\u0631 \u0644\u0646\u0642\u0644 \u0634\u062D\u0646\u0629 \u0643\u0648\u0644\u0648\u0645 \u0648\u0627\u062D\u062F \u062E\u0644\u0627\u0644 \u0627\u0644\u062F\u0627\u0626\u0631\u0629 \u0643\u0644\u0647\u0627. \u0648\u062A\u0642\u0627\u0633 \u0628\u0627\u0644\u0641\u0648\u0644\u062A."]),L(["Current also flows through the source itself, so part of the emf is lost across the internal resistance. Therefore emf is greater than the potential difference across the battery terminals (emf > V). In this unit we ignore the internal resistance, so V = emf.","\u064A\u0645\u0631 \u0627\u0644\u062A\u064A\u0627\u0631 \u062F\u0627\u062E\u0644 \u0627\u0644\u0645\u0635\u062F\u0631 \u0646\u0641\u0633\u0647 \u0641\u064A\u0636\u064A\u0639 \u062C\u0632\u0621 \u0645\u0646 \u0627\u0644\u0642\u0648\u0629 \u0627\u0644\u062F\u0627\u0641\u0639\u0629 \u0639\u0628\u0631 \u0627\u0644\u0645\u0642\u0627\u0648\u0645\u0629 \u0627\u0644\u062F\u0627\u062E\u0644\u064A\u0629. \u0644\u0630\u0644\u0643 \u062A\u0643\u0648\u0646 \u0627\u0644\u0642\u0648\u0629 \u0627\u0644\u062F\u0627\u0641\u0639\u0629 \u0623\u0643\u0628\u0631 \u0645\u0646 \u0641\u0631\u0642 \u0627\u0644\u062C\u0647\u062F \u0628\u064A\u0646 \u0637\u0631\u0641\u064A \u0627\u0644\u0628\u0637\u0627\u0631\u064A\u0629. \u0641\u064A \u0647\u0630\u0647 \u0627\u0644\u0648\u062D\u062F\u0629 \u0646\u0647\u0645\u0644 \u0627\u0644\u0645\u0642\u0627\u0648\u0645\u0629 \u0627\u0644\u062F\u0627\u062E\u0644\u064A\u0629 \u0641\u064A\u0643\u0648\u0646 V = emf."])],q(["Which source gives a direct current?","\u0623\u064A \u0645\u0635\u062F\u0631 \u064A\u0639\u0637\u064A \u062A\u064A\u0627\u0631\u0627 \u0645\u0633\u062A\u0645\u0631\u0627\u061F"],[["AC generator","Electric cell","Wall socket","Dynamo of a power station"],["\u0645\u0648\u0644\u062F \u062A\u064A\u0627\u0631 \u0645\u062A\u0631\u062F\u062F","\u0627\u0644\u0639\u0645\u0648\u062F \u0627\u0644\u0643\u0647\u0631\u0628\u064A","\u0645\u0642\u0628\u0633 \u0627\u0644\u062D\u0627\u0626\u0637","\u0645\u0648\u0644\u062F \u0645\u062D\u0637\u0629 \u0627\u0644\u0642\u0648\u0649"]],1)),P(["5. Connecting electric cells","5. \u062A\u0648\u0635\u064A\u0644 \u0627\u0644\u0623\u0639\u0645\u062F\u0629 \u0627\u0644\u0643\u0647\u0631\u0628\u064A\u0629"],[M(["A battery is a group of connected electric cells.","\u0627\u0644\u0628\u0637\u0627\u0631\u064A\u0629 \u0645\u062C\u0645\u0648\u0639\u0629 \u0645\u0646 \u0627\u0644\u0623\u0639\u0645\u062F\u0629 \u0627\u0644\u0643\u0647\u0631\u0628\u064A\u0629 \u0627\u0644\u0645\u062A\u0635\u0644\u0629 \u0645\u0639\u0627."]),_([["In series: positive pole of one cell to the negative pole of the next. The emf of the battery = the SUM of the emfs of the cells.","\u0639\u0644\u0649 \u0627\u0644\u062A\u0648\u0627\u0644\u064A: \u0627\u0644\u0642\u0637\u0628 \u0627\u0644\u0645\u0648\u062C\u0628 \u0644\u0639\u0645\u0648\u062F \u0628\u0627\u0644\u0633\u0627\u0644\u0628 \u0644\u0644\u0639\u0645\u0648\u062F \u0627\u0644\u062A\u0627\u0644\u064A. \u0627\u0644\u0642\u0648\u0629 \u0627\u0644\u062F\u0627\u0641\u0639\u0629 \u0644\u0644\u0628\u0637\u0627\u0631\u064A\u0629 = \u0645\u062C\u0645\u0648\u0639 \u0627\u0644\u0642\u0648\u0649 \u0627\u0644\u062F\u0627\u0641\u0639\u0629 \u0644\u0644\u0623\u0639\u0645\u062F\u0629."],["In parallel: all positive poles together and all negative poles together. The emf of the battery = the emf of ONE cell.","\u0639\u0644\u0649 \u0627\u0644\u062A\u0648\u0627\u0632\u064A: \u0643\u0644 \u0627\u0644\u0623\u0642\u0637\u0627\u0628 \u0627\u0644\u0645\u0648\u062C\u0628\u0629 \u0645\u0639\u0627 \u0648\u0643\u0644 \u0627\u0644\u0623\u0642\u0637\u0627\u0628 \u0627\u0644\u0633\u0627\u0644\u0628\u0629 \u0645\u0639\u0627. \u0627\u0644\u0642\u0648\u0629 \u0627\u0644\u062F\u0627\u0641\u0639\u0629 \u0644\u0644\u0628\u0637\u0627\u0631\u064A\u0629 = \u0627\u0644\u0642\u0648\u0629 \u0627\u0644\u062F\u0627\u0641\u0639\u0629 \u0644\u0639\u0645\u0648\u062F \u0648\u0627\u062D\u062F."]]),L(["Torch: cells in series to get a large emf. Power bank: cells in parallel to charge a phone many times without raising the output voltage.","\u0643\u0634\u0627\u0641 \u0627\u0644\u0625\u0636\u0627\u0621\u0629: \u0623\u0639\u0645\u062F\u0629 \u0639\u0644\u0649 \u0627\u0644\u062A\u0648\u0627\u0644\u064A \u0644\u062A\u0639\u0637\u064A \u0642\u0648\u0629 \u062F\u0627\u0641\u0639\u0629 \u0643\u0628\u064A\u0631\u0629. \u0627\u0644\u0628\u0646\u0643 \u0627\u0644\u0645\u062A\u0646\u0642\u0644 \u0644\u0644\u0637\u0627\u0642\u0629: \u0623\u0639\u0645\u062F\u0629 \u0639\u0644\u0649 \u0627\u0644\u062A\u0648\u0627\u0632\u064A \u0644\u064A\u0634\u062D\u0646 \u0627\u0644\u0647\u0627\u062A\u0641 \u0645\u0631\u0627\u062A \u0643\u062B\u064A\u0631\u0629 \u062F\u0648\u0646 \u0632\u064A\u0627\u062F\u0629 \u0641\u0631\u0642 \u0627\u0644\u062C\u0647\u062F."]),he(["Example: 3 identical cells of 3 V in series give 3 x 3 = 9 V across the bulb. In parallel they give 3 V.","\u0645\u062B\u0627\u0644: 3 \u0623\u0639\u0645\u062F\u0629 \u0645\u062A\u0645\u0627\u062B\u0644\u0629 \u0642\u0648\u0629 \u0643\u0644 \u0645\u0646\u0647\u0627 3 \u0641\u0648\u0644\u062A \u0639\u0644\u0649 \u0627\u0644\u062A\u0648\u0627\u0644\u064A \u062A\u0639\u0637\u064A 3 \xD7 3 = 9 \u0641\u0648\u0644\u062A. \u0648\u0639\u0644\u0649 \u0627\u0644\u062A\u0648\u0627\u0632\u064A \u062A\u0639\u0637\u064A 3 \u0641\u0648\u0644\u062A."])],q(["Four cells of 1.5 V in series give ...","\u0623\u0631\u0628\u0639\u0629 \u0623\u0639\u0645\u ,L(["Power is measured in watts (W) and 1 W = 1 J/s. A 9 W LED lamp consumes 9 J every second.","\u062A\u0642\u0627\u0633 \u0627\u0644\u0642\u062F\u0631\u0629 \u0628\u0627\u0644\u0648\u0627\u062A (W) \u0648 1 \u0648\u0627\u062A = 1 \u062C\u0648\u0644/\u062B\u0627\u0646\u064A\u0629. \u0645\u0635\u0628\u0627\u062D \u0644\u064A\u062F 9 \u0648\u0627\u062A \u064A\u0633\u062A\u0647\u0644\u0643 9 \u062C\u0648\u0644 \u0643\u0644 \u062B\u0627\u0646\u064A\u0629."]),Ke("E (J) = P (W) x t (s)"),L(["The energy efficiency label shows the monthly energy consumption and the efficiency level. The green arrow marked A means the highest efficiency and the lowest consumption.","\u062A\u0648\u0636\u062D \u0628\u0637\u0627\u0642\u0629 \u0643\u0641\u0627\u0621\u0629 \u0627\u0644\u0637\u0627\u0642\u0629 \u0627\u0644\u0627\u0633\u062A\u0647\u0644\u0627\u0643 \u0627\u0644\u0634\u0647\u0631\u064A \u0644\u0644\u0637\u0627\u0642\u0629 \u0648\u0645\u0633\u062A\u0648\u0649 \u0627\u0644\u0643\u0641\u0627\u0621\u0629. \u0627\u0644\u0633\u0647\u0645 \u0627\u0644\u0623\u062E\u0636\u0631 A \u064A\u0639\u0646\u064A \u0623\u0639\u0644\u0649 \u0643\u0641\u0627\u0621\u0629 \u0648\u0623\u0642\u0644 \u0627\u0633\u062A\u0647\u0644\u0627\u0643."])],q(["The unit of electric power is the ...","\u0648\u062D\u062F\u0629 \u0642\u064A\u0627\u0633 \u0627\u0644\u0642\u062F\u0631\u0629 \u0627\u0644\u0643\u0647\u0631\u0628\u064A\u0629 \u0647\u064A ..."],[["Joule","Watt","Volt","Ohm"],["\u0627\u0644\u062C\u0648\u0644","\u0627\u0644\u0648\u0627\u062A","\u0627\u0644\u0641\u0648\u0644\u062A","\u0627\u0644\u0623\u0648\u0645"]],1)),P(["6. The cost of electric energy","6. \u062A\u0643\u0644\u0641\u0629 \u0627\u0644\u0637\u0627\u0642\u0629 \u0627\u0644\u0643\u0647\u0631\u0628\u064A\u0629"],[L(["The joule is very small, so at home we use the kilowatt-hour (kW.h). 1 kW.h = 1000 x 60 x 60 = 3.6 x 10^6 J.","\u0627\u0644\u062C\u0648\u0644 \u0648\u062D\u062F\u0629 \u0635\u063A\u064A\u0631\u0629 \u062C\u062F\u0627 \u0644\u0630\u0644\  \u0623\u0644\u064A\u0644\u0627\u0646 \u0645\u062A\u0645\u0627\u062B\u0644\u0627\u0646 (BB \u0623\u0648 bb). \u0647\u062C\u064A\u0646 (\u0645\u062A\u0628\u0627\u064A\u0646 \u0627\u0644\u0623\u0644\u064A\u0644\u0627\u062A): \u0623\u0644\u064A\u0644\u0627\u0646 \u0645\u062E\u062A\u0644\u0641\u0627\u0646 (Bb)."])],q(["Bb is called ...","\u0627\u0644\u062A\u0631\u0643\u064A\u0628 Bb \u064A\u0633\u0645\u0649 ..."],[["Homozygous dominant","Homozygous recessive","Heterozygous (hybrid)","A gamete"],["\u0646\u0642\u064A \u0633\u0627\u0626\u062F","\u0646\u0642\u064A \u0645\u062A\u0646\u062D\u064D","\u0647\u062C\u064A\u0646","\u0645\u0634\u064A\u062C"]],2)),P(["4. Genotype and phenotype","4. \u0627\u0644\u0637\u0631\u0627\u0632 \u0627\u0644\u062C\u064A\u0646\u064A \u0648\u0627\u0644\u0637\u0631\u0627\u0632 \u0627\u0644\u0645\u0638\u0647\u0631\u064A"],[M(["Phenotype: the inherited trait that appears and can be observed. Genotype: the genetic makeup, i.e. the alleles the individual carries.","\u0627\u0644\u0637\u0631\u0627\u0632 \u0627\u0644\u0645\u0638\u0647\u0631\u064A: \u0627\u0644\u0635\u0641\u0629 \u0627\u0644\u0648\u0631\u0627\u062B\u064A\u0629 \u0627\u0644\u062A\u064A \u062A\u0638\u0647\u0631 \u0648\u064A\u0645\u0643\u0646 \u0645\u0644\u0627\u062D\u0638\u062A\u0647\u0627. \u0627\u0644\u0637\u0631\u0627\u0632 \u0627\u0644\u062C\u064A\u0646\u064A: \u0627\u0644\u062A\u0631\u0643\u064A\u0628 \u0627\u0644\u0648\u0631\u0627\u062B\u064A \u0623\u064A \u0627\u0644\u0623\u0644\u064A\u0644\u0627\u062A \u0627\u0644\u062A\u064A \u064A\u062D\u0645\u0644\u0647\u0627 \u0627\u0644\u0641\u0631\u062F."]),L(["The dominant allele is written as a capital letter and the recessive as the same small letter. For eye colour: B = brown (dominant), b = blue (recessive).","\u064A\u0631\u0645\u0632 \u0644\u0644\u0623\u0644\u064A\u0644 \u0627\u0644\u0633\u0627\u0626\u062F \u0628\u062D\u0631\u0641 \u0643\u0628\u064A\u0631 \u0648\u0644\u0644\u0645\u062A\u0646\u062D\u064A \u0628\u0646\u0641\u0633 \u0627\u0644\u062D\u0631\u0641 \u0635\u063A\u064A\u0631\u0627. \u0644\u0644\u0648\u0646 \u0627\u0644\u0639\u064A\u0646\u064A\u0646: B \u0628\u0646\u064A (\u0633\u0627\u0626\u062F) \u0648 b \u0623\u0632\u0631\u0642 (\u0645\u062A\u0646\u062D\u064D)."]),_([["BB: brown eyes (homozygous)","BB: \u0639\u064A\u0648\u0646 \u0628\u0646\u064A\u0629 (\u0646\u0642\u064A)"],["Bb: brown eyes (heterozygous)","Bb: \u0639\u064A\u0648\u0646 \u0628\u0646\u064A\u0629 (\u0647\u062C\u064A\u0646)"],["bb: blue eyes (homozygous recessive)","bb: \u0639\u064A\u0648\u0646 \u0632\u0631\u0642\u0627\u0621 (\u0646\u0642\u064A \u0645\u062A\u0646\u062D\u064D)"]]),J(["Two people with the same phenotype may have different genotypes (BB and Bb are both brown). A different genotype (cause) can give a different phenotype (effect). A recessive trait needs TWO recessive alleles to appear.","\u0642\u062F \u064A\u062A\u0634\u0627\u0628\u0647 \u0634\u062E\u0635\u0627\u0646 \u0641\u064A \u0627\u0644\u0637\u0631\u0627\u0632 \u0627\u0644\u0645\u0638\u0647\u0631\u064A \u0648\u064A\u062E\u062A\u0644\u0641\u0627\u0646 \u0641\u064A \u0627\u0644\u0637\u0631\u0627\u0632 \u0627\u0644\u062C\u064A\u0646\u064A (BB \u0648 Bb \u0643\u0644\u0627\u0647\u0645\u0627 \u0628\u0646\u064A). \u0627\u062E\u062A\u0644\u0627\u0641 \u0627\u0644\u0637\u0631\u0627\u0632 \u0627\u0644\u062C\u064A\u0646\u064A (\u0633\u0628\u0628) \u0642\u062F \u064A\u0639\u0637\u064A \u0637\u0631\u0627\u0632\u0627 \u0645\u0638\u0647\u0631\u064A\u0627 \u0645\u062E\u062A\u0644\u0641\u0627 (\u0646\u062A\u064A\u062C\u0629). \u0648\u0627\u0644\u0635\u0641\u0629 \u0627\u0644\u0645\u062A\u0646\u062D\u064A\u0629 \u062A\u062D\u062A\u0627\u062C \u0623\u0644\u064A\u0644\u064A\u0646 \u0645\u062A\u0646\u062D\u064A\u064A\u0646 \u0644\u062A\u0638\u0647\u0631."])],q(["A blue-eyed person (blue is recessive) has the genotype ...","\u0627\u0644\u0634\u062E\u0635 \u0630\u0648 \u0627\u0644\u0639\u064A\u0648\u0646 \u0627\u0644\u0632\u0631\u0642\u0627\u0621 (\u0627\u0644\u0632\u0631\u0642\u0627\u0621 \u0645\u062A\u0646\u062D\u064A\u0629) \u0637\u0631\u0627\u0632\u0647 \u0627\u0644\u062C\u064A\u0646\u064A ..."],[["BB","Bb","bb","None"],["BB","Bb","bb","\u0644\u0627 \u0634\u064A\u0621"]],2)),P(["5. Mendel and the first law","5. \u0645\u0646\u062F\u0644 \u0648\u0642\u0627\u0646\u0648\u0646\u0647 \u0627\u0644\u0623\u0648\u0644"],[L(["Gregor Mendel (1822-1884) experimented on pea plants because they have clear contrasting traits (tall/short, yellow/round...) and pollination can be controlled. He showed that traits are transmitted in regular patterns, not randomly.","\u0623\u062C\u0631\u0649 \u062C\u0631\u064A\u062C\u0648\u0631 \u0645\u0646\u062F\u0644 (1822-1884) \u062A\u062C\u0627\u0631\u0628\u0647 \u0639\u0644\u0649 \u0646\u0628\u0627\u062A \u0627\u0644\u0628\u0633\u0644\u0629 \u0644\u0623\u0646 \u0644\u0647 \u0635\u0641\u0627\u062A \u0645\u062A\u0636\u0627\u062F\u0629 \u0648\u0627\u0636\u062D\u0629 (\u0637\u0648\u064A\u0644/\u0642\u0635\u064A\u0631\u060C \u0623\u0635\u0641\u0631/\u0623\u062E\u0636\u0631...) \u0648\u064A\u0645\u0643\u0646 \u0627\u0644\u062A\u062D\u0643\u0645 \u0641\u064A \u0639\u0645\u0644\u064A\u0629 \u0627\u0644\u062A\u0644\u0642\u064A\u062D. \u0648\u0628\u064A\u0646 \u0623\u0646 \u0627\u0644\u0635\u0641\u0627\u062A \u062A\u0646\u062A\u0642\u0644 \u0628\u0623\u0646\u0645\u0627\u0637 \u0645\u0646\u062A\u0638\u0645\u0629 \u0648\u0644\u064A\u0633 \u0639\u0634\u0648\u0627\u0626\u064A\u0627."]),M(["Mendel's first law (segregation): when two purebred individuals with contrasting traits are crossed, the first generation (F1) shows only the dominant trait (100%). When F1 individuals are crossed, the second generation (F2) shows both traits in the ratio 3 dominant : 1 recessive.","\u0642\u0627\u0646\u0648\u0646 \u0645\u0646\u062F\u0644 \u0627\u0644\u0623\u0648\u0644 (\u0627\u0646\u0639\u0632\u0627\u0644 \u0627\u0644\u0635\u0641\u0627\u062A): \u0639\u0646\u062F \u062A\u0632\u0627\u0648\u062C \u0641\u0631\u062F\u064A\u0646 \u0646\u0642\u064A\u064A\u0646 \u0645\u062E\u062A\u0644\u0641\u064A\u0646 \u0641\u064A \u0635\u0641\u0629 \u0645\u062A\u0636\u0627\u062F\u0629 \u062A\u0638\u0647\u0631 \u0641\u064A \u0627\u0644\u062C\u064A\u0644 \u0627\u0644\u0623\u0648\u0644 \u0627\u0644\u0635\u0641\u0629 \u0627\u0644\u0633\u0627\u0626\u062F\u0629 \u0641\u0642\u0637 \u0628\u0646\u0633\u0628\u0629 100%. \u0648\u0639\u0646\u062F \u062A\u0632\u0627\u0648\u062C \u0623\u0641\u0631\u0627\u062F \u0627\u0644\u062C\u064A\u0644 \u0627\u0644\u0623\u0648\u0644 \u0628\u0628\u0639\u0636\u0647\u0627 \u062A\u0638\u0647\u0631 \u0627\u0644\u0635\u0641\u062A\u0627\u0646 \u0641\u064A \u0627\u0644\u062C\u064A\u0644 \u0627\u0644\u062B\u0627\u0646\u064A \u0628\u0646\u0633\u0628\u0629 3 \u0633\u0627\u0626\u062F : 1 \u0645\u062A\u0646\u062D\u064D."]),he(["Yellow seeds (Y) are dominant over green (y). YY x yy gives F1 all Yy (yellow). Yy x Yy gives F2: 1 YY : 2 Yy : 1 yy, so 3 yellow : 1 green.","\u0627\u0644\u0628\u0630\u0648\u0631 \u0627\u0644\u0635\u0641\u0631\u0627\u0621 (Y) \u0633\u0627\u0626\u062F\u0629 \u0639\u0644\u0649 \u0627\u0644\u062E\u0636\u0631\u0627\u0621 (y). YY \xD7 yy \u064A\u0646\u062A\u062C \u062C\u064A\u0644 \u0623\u0648\u0644 \u0643\u0644\u0647 Yy (\u0623\u0635\u0641\u0631). Yy \xD7 Yy \u064A\u0646\u062A\u062C \u062C\u064A\u0644\u0627 \u062B\u0627\u0646\u064A\u0627: 1 YY : 2 Yy : 1 yy \u0623\u064A 3 \u0623\u0635\u0641\u0631 : 1 \u0623\u062E\u0636\u0631."])],q(["The F2 ratio in a monohybrid cross is ...","\u0646\u0633\u0628\u0629 \u0627\u0644\u062C\u064A\u0644 \u0627\u0644\u062B\u0627\u0646\u064A \u0641\u064A \u0627\u0644\u062A\u0632\u0627\u0648\u062C \u0627\u0644\u0623\u062D\u0627\u062F\u064A ..."],[["1 : 1","3 : 1","9 : 3 : 3 : 1","2 : 1"],["1 : 1","3 : 1","9 : 3 : 3 : 1","2 : 1"]],1)),P(["6. The Punnett square","6. \u0645\u0631\u0628\u0639 \u0628\u0627\u0646\u064A\u062A"],[M(["Punnett square: a tool used to predict the possible genotypes and phenotypes of the offspring of a certain mating.","\u0645\u0631\u0628\u0639 \u0628\u0627\u0646\u064A\u062A: \u0623\u062F\u0627\u0629 \u062A\u0633\u062A\u062E\u062F\u0645 \u0644\u0644\u062A\u0646\u0628\u0624 \u0628\u0627\u0644\u0637\u0631\u0632 \u0627\u0644\u062C\u064A\u0646\u064A\u0629 \u0648\u0627\u0644\u0645\u0638\u0647\u0631\u064A\u0629 \u0627\u0644\u0645\u062D\u062A\u0645\u0644\u0629 \u0644\u0644\u0623\u0628\u0646\u0627\u0621 \u0627\u0644\u0646\u0627\u062A\u062C\u064A\u0646 \u0639\u0646 \u062A\u0632\u0627\u0648\u062C \u0645\u0639\u064A\u0646."]),_([["Count the types of gametes of each parent to decide the size of the grid.","\u062D\u062F\u062F \u0639\u062F\u062F \u0623\u0646\u0648\u0627\u0639 \u0627\u0644\u0623\u0645\u0634\u0627\u062C \u0644\u0643\u0644 \u0623\u0628 \u0644\u062A\u0639\u0631\u0641 \u062D\u062C\u0645 \u0627\u0644\u062C\u062F\u0648\u0644."],["Write one parent's gametes across the top and the other's down the side.","\u0627\u0643\u062A\u0628 \u0623\u0645\u0634\u0627\u062C \u0623\u062D\u062F \u0627\u0644\u0623\u0628\u0648\u064A\u0646 \u0623\u0641\u0642\u064A\u0627 \u0641\u064A \u0627\u0644\u0623\u0639\u0644\u0649 \u0648\u0623\u0645\u0634\u0627\u062C \u0627\u0644\u0622\u062E\u0631 \u0631\u0623\u0633\u064A\u0627 \u0639\u0644\u0649 \u0627\u0644\u062C\u0627\u0646\u0628."],["Fill every cell by combining one allele from each side.","\u0627\u0645\u0644\u0623 \u0643\u0644 \u062E\u0627\u0646\u0629 \u0628\u062F\u0645\u062C \u0623\u0644\u064A\u0644 \u0645\u0646 \u0643\u0644 \u062C\u0627\u0646\u0628."]]),he(["Tt x Tt (tall T is dominant): TT, Tt, Tt, tt. Probability of a short plant = 1/4 = 25%. Cross Aa x aa gives 1 Aa : 1 aa, so 50% each.","Tt \xD7 Tt (\u0627\u0644\u0637\u0648\u0644 T \u0633\u0627\u0626\u062F): TT \u0648 Tt \u0648 Tt \u0648 tt. \u0627\u062D\u062A\u0645\u0627\u0644 \u0627\u0644\u0646\u0628\u0627\u062A \u0627\u0644\u0642\u0635\u064A\u0631 = 1/4 = 25%. \u0627\u0644\u062A\u0632\u0627\u0648\u062C Aa \xD7 aa \u064A\u0639\u0637\u064A 1 Aa : 1 aa \u0623\u064A 50% \u0644\u0643\u0644 \u0645\u0646\u0647\u0645\u0627."]),L(["Symbols: P akes 4 equally likely gametes: RY, Ry, rY, ry, so there are 16 combinations in F2.","\u0643\u0644 \u0646\u0628\u0627\u062A \u0645\u0646 F1 \u064A\u0646\u062A\u062C 4 \u0623\u0646\u0648\u0627\u0639 \u0645\u062A\u0633\u0627\u0648\u064A\u0629 \u0627\u0644\u0627\u062D\u062A\u0645\u0627\u0644 \u0645\u0646 \u0627\u0644\u0623\u0645\u0634\u0627\u062C: RY \u0648 Ry \u0648 rY \u0648 ry \u0641\u062A\u0643\u0648\u0646 \u0647\u0646\u0627\u0643 16 \u062A\u0648\u0644\u064A\u0641\u0629 \u0641\u064A F2."],["The F2 phenotype ratio is 9 : 3 : 3 : 1 (9 round yellow, 3 round green, 3 wrinkled yellow, 1 wrinkled green).","\u0646\u0633\u0628\u0629 \u0627\u0644\u0637\u0631\u0632 \u0627\u0644\u0645\u0638\u0647\u0631\u064A\u0629 \u0641\u064A F2 \u0647\u064A 9 : 3 : 3 : 1 (9 \u0645\u0633\u062A\u062F\u064A\u0631 \u0623\u0635\u0641\u0631 \u06483 \u0645\u0633\u062A\u062F\u064A\u0631 \u0623\u062E\u0636\u0631 \u06483 \u0645\u062C\u0639\u062F \u0623\u0635\u0641\u0631 \u06481 \u0645\u062C\u0639\u062F \u0623\u062E\u0636\u0631)."],["Each trait alone still gives 3 : 1.","\u0648\u0643\u0644 \u0635\u0641\u0629 \u0639\u0644\u0649 \u062D\u062F\u0629 \u062A\u0639\u0637\u064A 3 : 1."]])],q(["The F2 ratio for two traits is ...","\u0627\u0644\u0646\u0633\u0628\u0629 \u0627\u0644\u0645\u0638\u0647\u0631\u064A\u0629 \u0644\u0644\u062C\u064A\u0644 \u0627\u0644\u062B\u0627\u0646\u064A \u0644\u0635\u0641\u062A\u064A\u0646 ..."],[["3 : 1","9 : 3 : 3 : 1","1 : 1 : 1 : 1","1 : 2 : 1"],["3 : 1","9 : 3 : 3 : 1","1 : 1 : 1 : 1","1 : 2 : 1"]],1)),P(["8. Diversity and inherited diseases","8. \u0627\u0644\u062A\u0646\u0648\u0639 \u0627\u0644\u0648\u0631\u0627\u062B\u064A \u0648\u0627\u0644\u0623\u0645\u0631\u0627\u0636 \u0627\u0644\u0648\u0631\u0627\u062B\u064A\u0629"],[L(["Every human has a unique genetic makeup. This genetic diversity helps humans adapt to different environments and survive over time.","\u0644\u0643\u0644 \u0625\u0646\u0633\u0627\u0646 \u062A\u0631\u0643\u064A\u0628 \u0648\u0631\u0627\u062B\u064A \u0641\u nue forever because of environmental resistance: depletion of resources, competition, and fast spread of diseases and parasites.","\u0644\u0627 \u064A\u0633\u062A\u0645\u0631 \u0627\u0644\u0646\u0645\u0648 \u0644\u0644\u0623\u0628\u062F \u0628\u0633\u0628\u0628 \u0627\u0644\u0645\u0642\u0627\u0648\u0645\u0629 \u0627\u0644\u0628\u064A\u0626\u064A\u0629: \u0646\u0641\u0627\u062F \u0627\u0644\u0645\u0648\u0627\u0631\u062F\u060C \u0632\u064A\u0627\u062F\u0629 \u0627\u0644\u062A\u0646\u0627\u0641\u0633\u060C \u0648\u0627\u0646\u062A\u0634\u0627\u0631 \u0627\u0644\u0623\u0645\u0631\u0627\u0636 \u0648\u0627\u0644\u0637\u0641\u064A\u0644\u064A\u0627\u062A \u0628\u0633\u0631\u0639\u0629."]]),M(["Carrying capacity: the maximum number of individuals of a species that the environment can support continuously without damaging its resources.","\u0627\u0644\u0633\u0639\u0629 \u0627\u0644\u062A\u062D\u0645\u0644\u064A\u0629: \u0623\u0642\u0635\u0649 \u0639\u062F\u062F \u0645\u0646 \u0623\u0641\u0631\u0627\u062F \u0646\u0648\u0639 \u0645\u0639\u064A\u0646 \u062A\u0633\u062A\u0637\u064A\u0639 \u0627\u0644\u0628\u064A\u0626\u0629 \u0625\u0639\u0627\u0644\u062A\u0647 \u0628\u0627\u0633\u062A\u0645\u0631\u0627\u0631 \u062F\u0648\u0646 \u0627\u0633\u062A\u0646\u0632\u0627\u0641 \u0645\u0648\u0627\u0631\u062F\u0647\u0627."]),J(["If a population goes above the carrying capacity, resources run short, so deaths increase and the number falls. Nature reserves monitor it to keep the ecosystem balanced.","\u0625\u0630\u0627 \u0632\u0627\u062F \u0627\u0644\u0639\u062F\u062F \u0639\u0646 \u0627\u0644\u0633\u0639\u0629 \u0627\u0644\u062A\u062D\u0645\u0644\u064A\u0629 \u062A\u0642\u0644 \u0627\u0644\u0645\u0648\u0627\u0631\u062F \u0641\u062A\u0632\u062F\u0627\u062F \u0627\u0644\u0648\u0641\u064A\u0627\u062A \u0648\u064A\u0646\u062E\u0641\u0636 \u0627\u0644\u0639\u062F\u062F. \u0648\u062A\u0631\u0627\u0642\u0628 \u0627\u0644\u0645\u062D\u0645\u064A\u0627\u062A \u0627\u0644\u0637\u0628\u064A\u0639\u06 ing environment: less reproduction and more deaths, so the population declines.","\u0628\u064A\u0626\u0629 \u0645\u062A\u062F\u0647\u0648\u0631\u0629: \u064A\u0642\u0644 \u0627\u0644\u062A\u0643\u0627\u062B\u0631 \u0648\u062A\u0632\u062F\u0627\u062F \u0627\u0644\u0648\u0641\u064A\u0627\u062A \u0641\u064A\u0642\u0644 \u0627\u0644\u0639\u062F\u062F."]]),M(["Genetic factors: the inherited traits passed from parents to offspring that affect an organism's ability to adapt, survive and reproduce, e.g. fur colour, disease resistance, tolerance of heat or cold, sharp eyesight.","\u0627\u0644\u0639\u0648\u0627\u0645\u0644 \u0627\u0644\u0648\u0631\u0627\u062B\u064A\u0629: \u0627\u0644\u0635\u0641\u0627\u062A \u0627\u0644\u0648\u0631\u0627\u062B\u064A\u0629 \u0627\u0644\u062A\u064A \u062A\u0646\u062A\u0642\u0644 \u0645\u0646 \u0627\u0644\u0622\u0628\u0627\u0621 \u0625\u0644\u0649 \u0627\u0644\u0623\u0628\u0646\u0627\u0621 \u0648\u062A\u0624\u062B\u0631 \u0641\u064A \u0642\u062F\u0631\u0629 \u0627\u0644\u0643\u0627\u0626\u0646 \u0639\u0644\u0649 \u0627\u0644\u062A\u0643\u064A\u0641 \u0648\u0627\u0644\u0628\u0642\u0627\u0621 \u0648\u0627\u0644\u062A\u0643\u0627\u062B\u0631 \u0645\u062B\u0644 \u0644\u0648\u0646 \u0627\u0644\u0641\u0631\u0627\u0621 \u0648\u0645\u0642\u0627\u0648\u0645\u0629 \u0627\u0644\u0623\u0645\u0631\u0627\u0636 \u0648\u062A\u062D\u0645\u0644 \u0627\u0644\u062D\u0631\u0627\u0631\u0629 \u0623\u0648 \u0627\u0644\u0628\u0631\u0648\u062F\u0629 \u0648\u062D\u062F\u0629 \u0627\u0644\u0628\u0635\u0631."]),L(["Examples: heavy rain gives more wheat (environmental); an inherited disease reduces an animal species (genetic); pollution reduces fish in a lake (environmental); strong beaks help birds crack hard seeds (genetic).","\u0623\u0645\u062B\u0644\u0629: \u0627\u0644\u0623\u0645\u0637\u0627\u0631 \u0627\u0644\u063A\u0632\u064A\u0631\u0629 \u062A\u0632\u064A\u062F \u0627\u0644\u0642\u0645\u062D (\u0628\u064A\u0626\u064A)\u061B \u0645\u0631\u0636 \u0648\u0631\u0627\u062B\u064A \u064A\u0642\u0644\u0644 \u0646\u0648\u0639\u0627 \u0645\u0646 \u0627\u0644\u062D\u064A\u0648\u0627\u0646\u0627\u062A (\u0648\u0631\u0627\u062B\u064A)\u061B \u0627\u0644\u062A\u0644\u0648\u062B \u064A\u0642\u0644\u0644 \u0623\u0633\u0645\u0627\u0643 \u0627\u0644\u0628\u062D\u064A\u0631\u0629 (\u0628\u064A\u0626\u064A)\u061B \u0627\u0644\u0645\u0646\u0627\u0642\u064A\u0631 \u0627\u0644\u0642\u0648\u064A\u0629 \u062A\u0633\u0627\u0639\u062F \u0627\u0644\u0637\u064A\u0648\u0631 \u0639\u0644\u0649 \u0643\u0633\u0631 \u0627\u0644\u0628\u0630\u0648\u0631 \u0627\u0644\u0635\u0644\u0628\u0629 (\u0648\u0631\u0627\u062B\u064A)."])],q(["Amount of available food is a ... factor.","\u0643\u0645\u064A\u0629 \u0627\u0644\u063A\u0630\u0627\u0621 \u0627\u0644\u0645\u062A\u0627\u062D \u0639\u0627\u0645\u0644 ..."],[["Genetic","Environmental","Chemical","Magnetic"],["\u0648\u0631\u0627\u062B\u064A","\u0628\u064A\u0626\u064A","\u0643\u064A\u0645\u064A\u0627\u0626\u064A","\u0645\u063A\u0646\u0627\u0637\u064A\u0633\u064A"]],1)),P(["4. Adaptation and natural selection","4. \u0627\u0644\u062A\u0643\u064A\u0641 \u0648\u0627\u0644\u0627\u0646\u062A\u062E\u0627\u0628 \u0627\u0644\u0637\u0628\u064A\u0639\u064A"],[M(["Adaptation: an inherited trait that helps an organism survive and reproduce in its environment (e.g. thick fur in the cold).","\u0627\u0644\u062A\u0643\u064A\u0641: \u0635\u0641\u0629 \u0648\u0631\u0627\u062B\u064A\u0629 \u062A\u0633\u0627\u0639\u062F \u0627\u0644\u0643\u0627\u0626\u0646 \u0639\u0644\u0649 \u0627\u0644\u0628\u0642\u0627\u0621 \u0648\u0627\u0644\u062A\u0643\u0627\u062B\u0631 \u0641\u064A \u0628\u064A\u0626\u062A\u0647 (\u0645\u062B\u0644 \u0627\u0644\u0641\u0631\u0627\u0621 \u0627\u0644\u0633\u0645\u064A\u0643 \u0641\u064A \u0627\u0644\u0628\u0631\u062F)."]),M(["Natural selection: individuals with inherited traits suited to their environment are more likely to survive and reproduce, so these traits become more common over the generations.","\u0627\u0644\u0627\u0646\u062A\u062E\u0627\u0628 \u0627\u0644\u0637\u0628\u064A\u0639\u064A: \u0627\u0644\u0623\u0641\u0631\u0627\u062F \u0630\u0648\u0648 \u0627\u0644\u0635\u0641\u0627\u062A \u0627\u0644\u0648\u0631\u0627\u062B\u064A\u0629 \u0627\u0644\u0645\u0646\u0627\u0633\u0628\u0629 \u0644\u0628\u064A\u0626\u062A\u0647\u0645 \u0623\u0643\u062B\u0631 \u0639\u0631\u0636\u0629 \u0644\u0644\u0628\u0642\u0627\u0621 \u0648\u0627\u0644\u062A\u0643\u0627\u062B\u0631 \u0641\u062A\u0635\u0628\u062D \u0647\u0630\u0647 \u0627\u0644\u0635\u0641\u0627\u062A \u0623\u0643\u062B\u0631 \u0634\u064A\u0648\u0639\u0627 \u0639\u0628\u0631 \u0627\u0644\u0623\u062C\u064A\u0627\u0644."]),_([["The environment does NOT give the organism new traits; it selects from the traits that already exist.","\u0627\u0644\u0628\u064A\u0626\u0629 \u0644\u0627 \u062A\u0645\u0646\u062D \u0627\u0644\u0643\u0627\u0626\u0646 \u0635\u0641\u0627\u062A \u062C\u062F\u064A\u062F\u0629 \u0628\u0644 \u062A\u0646\u062A\u062E\u0628 \u0645\u0646 \u0627\u0644\u0635\u0641\u0627\u062A \u0627\u0644\u0645\u0648\u062C\u0648\u062F\u0629 \u0628\u0627\u0644\u0641\u0639\u0644."],["Less adapted individuals may die before reproducing or reproduce less.","\u0627\u0644\u0623\u0641\u0631\u0627\u062F \u0627\u0644\u0623\u0642\u0644 \u062A\u0643\u064A\u0641\u0627 \u0642\u062F \u064A\u0645\u0648\u062A\u0648\u0646 \u0642\u0628\u0644 \u0627\u0644\u062A\u0643\u0627\u062B\u0631 \u0623\u0648 \u064A\u062A\u0643\u0627\u062B\u0631\u0648\u0646 \u0628\u0646\u0633\u0628\u0629 \u0623\u0642\u0644."],["It is a cumulative process over many generations.","\u0639\u0645\u0644\u064A\u0629 \u062A\u0631\u0627\u0643\u0645\u064A\u0629 \u062A\u062D\u062F\u062B \u0639\u0628\u0631 \u0623\u062C\u064A\u0627\u0644 \u0643\u062B\u064A\u0631\u0629."]])],q(["Natural selection is caused by the ...","\u064A\u062D\u062F\u062B \u0627\u0644\u0627\u0646\u062A\u062E\u0627\u0628 \u0627\u0644\u0637\u0628\u064A\u0639\u064A \u0628\u0633\u0628\u0628 ..."],[["Farmer","Environment","Teacher","Doctor"],["\u0627\u0644\u0645\u0632\u0627\u0631\u0639","\u0627\u0644\u0628\u064A\u0626\u0629","\u0627\u0644\u0645\u0639\u0644\u0645","\u0627\u0644\u0637\u0628\u064A\u0628"]],1)),P(["5. Examples of natural selection","5. \u0623\u0645\u062B\u0644\u0629 \u0639\u0644\u0649 \u0627\u0644\u0627\u0646\u062A\u062E\u0627\u0628 \u0627\u0644\u0637\u0628\u064A\u0639\u064A"],[he(["Moths: before the Industrial Revolution tree trunks were light with lichens, so light moths were hidden and survived. After pollution, trunks became dark and lichens disappeared, so dark moths survived and became more common while light moths decreased.","\u0641\u0631\u0627\u0634\u0627\u062A: \u0642\u0628\u0644 \u0627\u0644\u062B\u0648\u0631\u0629 \u0627\u0644\u0635\u0646\u0627\u0639\u064A\u0629 \u0643\u0627\u0646\u062A \u0627\u0644\u062C\u0630\u0648\u0639 \u0641\u0627\u062A\u062D\u0629 \u0628\u0627\u0644\u0623\u0634\u0646\u0627\u062A \u0641\u0646\u062C\u062A \u0627\u0644\u0641\u0631\u0627\u0634\u0627\u062A \u0627\u0644\u0641\u0627\u062A\u062D\u0629 \u0644\u0623\u0646\u0647\u0627 \u0623\u0642\u0644 \u0648\u0636\u0648\u062D\u0627. \u0628\u0639\u062F \u0627\u0644\u062A\u0644\u0648\u062B \u0623\u0635\u0628\u062D\u062A \u0627\u0644\u062C\u0630\u0648\u0639 \u062F\u0627\u0643\u0646\u0629 \u0648\u0627\u062E\u062A\u0641\u062A \u0627\u0644\u0623\u0634\u0646\u0627\u062A \u0641\u0646\u062C\u062A \u0627\u0644\u0641\u0631\u0627\u0634\u0627\u062A \u0627\u0644\u062F\u0627\u0643\u0646\u0629 \u0648\u0632\u0627\u062F\u062A \u0623\u0639\u062F\u0627\u062F\u0647\u0627 \u0648\u0642\u0644\u062A \u0627\u0644\u0641\u0627\u062A\u062D\u0629."]),J(["Lichens are formed by a fungus living with an alga or cyanobacterium. They are bioindicators of air quality.","\u0627\u0644\u0623\u0634\u0646\u0627\u062A \u0643\u0627\u0626\u0646\u0627\u062A \u062A\u062A\u0643\u0648\u0646 \u0645\u0646 \u0641\u0637\u0631 \u064A\u0639\u064A\u0634 \u0645\u0639 \u0637\u062D\u0644\u0628 \u0623\u0648 \u0628\u0643\u062A\u064A\u0631\u064A\u0627 \u0632\u0631\u0642\u0627\u0621\u060C \u0648\u0647\u064A \u0645\u0624\u0634\u0631\u0627\u062A \u062D\u064A\u0648\u064A\u0629 \u0644\u062C\u0648\u062F\u0629 \u0627\u0644\u0647\u0648\u0627\u0621."]),he(["Rabbits: out of 100 rabbits (60 fast, 40 slow), 50 fast and 10 slow survive. Fast survival = 50/60 (83%), slow = 10/40 (25%). Fast rabbits are more likely to pass on their trait.","\u0623\u0631\u0627\u0646\u0628: \u0645\u0646 100 \u0623\u0631\u0646\u0628 (60 \u0633\u0631\u064A\u0639\u0627 \u064840 \u0628\u0637\u064A\u0626\u0627) \u0646\u062C\u0627 50 \u0633\u0631\u064A\u0639\u0627 \u064810 \u0628\u0637\u064A\u0626\u0629. \u0646\u0633\u0628\u0629 \u0646\u062C\u0627\u0629 \u0627\u0644\u0633\u0631\u064A\u0639\u0629 = 50/60 (83%) \u0648\u0627\u0644\u0628\u0637\u064A\u0626\u0629 = 10/40 (25%). \u0641\u0627\u0644\u0623\u0631\u0627\u0646\u0628 \u0627\u0644\u0633\u0631\u064A\u0639\u0629 \u0623\u0643\u062B\u0631 \u0627\u062D\u062A\u0645\u0627\u0644\u0627 \u0644\u0646\u0642\u0644 \u0635\u0641\u062A\u0647\u0627."])],q(["Why did dark moths increase after pollution?","\u0644\u0645\u0627\u0630\u0627 \u0632\u0627\u062F\u062A \u0627\u0644\u0641\u0631\u0627\u0634\u0627\u062A \u0627\u0644\u062F\u0627\u0643\u0646\u0629 \u0628\u0639\u062F \u0627\u0644\u062A\u0644\u0648\u062B\u061F"],[["They were less visible to predators","They were bigger","They were faster","They ate lichens"],["\u0643\u0627\u0646\u062A \u0623\u0642\u0644 \u0648\u0636\u0648\u062D\u0627 \u0644\u0644\u0645\u0641\u062A\u0631\u0633\u0627\u062A","\u0643\u0627\u0646\u062A \u0623\u0643\u0628\u0631","\u0643\u0627\u0646\u062A \u0623\u0633\u0631\u0639","\u0643\u0627\u0646\u062A \u062A\u0623\u0643\u0644 \u0627\u0644\u0623\u0634\u0646\u0627\u062A"]],0)),P(["6. Artificial selection","6. \u0627\u0644\u0627\u0646\u062A\u062E\u0627\u0628 \u0627\u0644\u0635\u0646\u0627\u0639\u064A"],[M(["Artificial selection: humans choose plants or animals with desirable traits and breed them so the traits become more pronounced in the offspring.","\u0627\u0644\u0627\u0646\u062A\u062E\u0627\u0628 \u0627\u0644\u0635\u0646\u0627\u0639\u064A: \u064A\u062E\u062A\u0627\u0631 \u0627\u0644\u0625\u0646\u0633\u0627\u0646 \u0646\u0628\u0627\u062A\u0627\u062A \u0623\u0648 \u062D\u064A\u0648\u0627\u0646\u0627\u062A \u0630\u0627\u062A \u0635\u0641\u0627\u062A \u0645\u0631\u063A\u0648\u0628\u0629 \u0648\u064A\u0631\u0628\u064A\u0647\u0627 \u0644\u062A\u0638\u0647\u0631 \u0647\u0630\u0647 \u0627\u0644\u0635\u0641\u0627\u062A \u0628\u0634\u0643\u0644 \u0623\u0648\u0636\u062D \u0641\u064A \u0627\u0644\u0646\u0633\u0644."]),_([["Examples: larger fruits, cattle with more meat or milk, hens that lay more eggs, dogs with certain traits.","\u0623\u0645\u062B\u0644\u0629: \u062B\u0645\u0627\u0631 \u0623\u0643\u0628\u0631\u060C \u0645\u0627\u0634\u064A\u0629 \u0623\u0643\u062B\u0631 \u0644\u062D\u0645\u0627 \u0623\u0648 \u0644\u0628\u0646\u0627\u060C \u062F\u062C\u0627\u062C \u0623\u0643\u062B\u0631 \u0628\u064A\u0636\u0627\u060C \u0643\u0644\u0627\u0628 \u0628\u0635\u0641\u0627\u062A \u0645\u0639\u064A\u0646\u0629."]]),Ke("Natural: environment | Artificial: humans"),L(["Natural selection is driven by the environment, usually acts slowly over long periods, and serves survival and adaptation. Artificial selection is driven by humans, can change traits in a short time, and serves human needs.","\u0627\u0644\u0627\u0646\u062A\u062E\u0627\u0628 \u0627\u0644\u0637\u0628\u064A\u0639\u064A \u062A\u062D\u0631\u0643\u0647 \u0627\u0644\u0628\u064A\u0626\u0629 \u0648\u063A\u0627\u0644\u0628\u0627 \u0645\u0627 \u064A\u062D\u062F\u062B \u0628\u0628\u0637\u0621 \u0639\u0644\u0649 \u0645\u062F\u0649 \u0641\u062A\u0631\u0627\u062A \u0637\u0648\u064A\u0644\u0629 \u0648\u064A\u0631\u062A\u0628\u0637 \u0628\u0627\u0644\u0628\u0642\u0627\u0621 \u0648\u0627\u0644\u062A\u0643\u064A\u0641. \u0623\u0645\u0627 \u0627\u0644\u0627\u0646\u062A\u062E\u0627\u0628 \u0627\u0644\u0635\u0646\u0627\u0639\u064A \u0641\u064A\u0642\u0648\u0645 \u0628\u0647 \u0627\u0644\u0625\u0646\u0633\u06 before vertebrates.","\u0641\u064A \u062A\u062A\u0627\u0628\u0639 \u0635\u062E\u0631\u064A \u063A\u064A\u0631 \u0645\u0636\u0637\u0631\u0628 \u062A\u0643\u0648\u0646 \u0627\u0644\u0637\u0628\u0642\u0627\u062A \u0627\u0644\u0623\u0639\u0645\u0642 \u0623\u0642\u062F\u0645. \u0644\u0630\u0644\u0643 \u0641\u0627\u0644\u0643\u0627\u0626\u0646\u0627\u062A \u0627\u0644\u062A\u064A \u0648\u062C\u062F\u062A \u062D\u0641\u0631\u064A\u0627\u062A\u0647\u0627 \u0641\u064A \u0637\u0628\u0642\u0627\u062A \u0623\u0639\u0645\u0642 \u0638\u0647\u0631\u062A \u0642\u0628\u0644 \u0627\u0644\u062A\u064A \u0641\u064A \u0627\u0644\u0637\u0628\u0642\u0627\u062A \u0627\u0644\u0639\u0644\u064A\u0627. \u0641\u0645\u062B\u0644\u0627 \u062D\u0641\u0631\u064A\u0627\u062A \u0627\u0644\u0644\u0627\u0641\u0642\u0627\u0631\u064A\u0627\u062A \u0623\u0639\u0645\u0642 \u0645\u0646 \u062D\u0641\u0631\u064A\u0627\u062A \u0627\u0644\u0641\u0642\u0627\u0631\u064A\u0627\u062A\u060C \u0644\u0630\u0644\u0643 \u0638\u0647\u0631\u062A \u0645\u0639\u0638\u0645 \u0627\u0644\u0644\u0627\u0641\u0642\u0627\u0631\u064A\u0627\u062A \u0642\u0628\u0644 \u0627\u0644\u0641\u0642\u0627\u0631\u064A\u0627\u062A."]),J(["The Geological Museum in Cairo displays rocks, fossils, a complete skeleton of an ancient whale, a Moon-rock sample and a Mars meteorite.","\u064A\u0639\u0631\u0636 \u0627\u0644\u0645\u062A\u062D\u0641 \u0627\u0644\u062C\u064A\u0648\u0644\u0648\u062C\u064A \u0641\u064A \u0627\u0644\u0642\u0627\u0647\u0631\u0629 \u0635\u062E\u0648\u0631\u0627 \u0648\u062D\u0641\u0631\u064A\u0627\u062A \u0648\u0647\u064A\u0643\u0644\u0627 \u0643\u0627\u0645\u0644\u0627 \u0644\u062D\u0648\u062A \u0642\u062F\u064A\u0645 \u0648\u0639\u064A\u0646\u0629 \u0645\u0646 \u0635\u062E\u0648\u0631 \u0627\u0644\u0642\u0645\u0631 \u0648\u0639\u064A\u0646\u0629 \u0645\u0646 \u0646\u064A\u0632\u0643 \u0627\u0644\u0645\u0631\u064A\u062E."])],q(["In undisturbed rock layers, deeper layers are ...","\u0641\u064A \u0627\u0644\u0637\u0628\u0642\u0627\u062A \u0627\u0644\u0635\u062E\u0631\u064A\u0629 \u063A\u064A\u0631 \u0627\u0644\u0645\u0636\u0637\u0631\u0628\u0629 \u062A\u0643\u0648\u0646 \u0627\u0644\u0637\u0628\u0642\u0627\u062A \u0627\u0644\u0623\u0639\u0645\u0642 ..."],[["Younger","Older","The same age","Always empty"],["\u0623\u062D\u062F\u062B","\u0623\u0642\u062F\u0645","\u0628\u0646\u0641\u0633 \u0627\u0644\u0639\u0645\u0631","\u062E\u0627\u0644\u064A\u0629 \u062F\u0627\u0626\u0645\u0627"]],1)),P(["4. Mass extinction and ancient environments","4. \u0627\u0644\u0627\u0646\u0642\u0631\u0627\u0636 \u0627\u0644\u062C\u0645\u0627\u0639\u064A \u0648\u0627\u0644\u0628\u064A\u0626\u0627\u062A \u0627\u0644\u0642\u062F\u064A\u0645\u0629"],[M(["Mass extinction: a huge number of species die out in a relatively short time. About 66 million years ago a mass extinction wiped out about 75% of all species, including most dinosaurs.","\u0627\u0644\u0627\u0646\u0642\u0631\u0627\u0636 \u0627\u0644\u062C\u0645\u0627\u0639\u064A: \u0645\u0648\u062A \u0639\u062F\u062F \u0636\u062E\u0645 \u0645\u0646 \u0627\u0644\u0623\u0646\u0648\u0627\u0639 \u0641\u064A \u0648\u0642\u062A \u0642\u0635\u064A\u0631 \u0646\u0633\u0628\u064A\u0627. \u0642\u0628\u0644 \u0646\u062D\u0648 66 \u0645\u0644\u064A\u0648\u0646 \u0633\u0646\u0629 \u0623\u0628\u0627\u062F \u0627\u0646\u0642\u0631\u0627\u0636 \u062C\u0645\u0627\u0639\u064A \u062D\u0648\u0627\u0644\u064A 75% \u0645\u0646 \u0627\u0644\u0623\u0646\u0648\u0627\u0639 \u0645\u0646\u0647\u0627 \u0645\u0639\u0638\u0645 \u0623\u0646\u0648\u0627\u0639 \u0627\u0644\u062F\u064A\u0646\u0627\u0635\u0648\u0631\u0627\u062A."]),_([["Hypotheses: meteorite impacts and other cosmic catastrophes, severe climate change and atmosphere changes, massive volcanic activity, changes in sea level and the shape of the continents.","\u0627\u0644\u0641\u0631\u0636\u064A\u0627\u062A: \u0627\u0635\u0637\u062F\u0627\u0645 \u0646\u064A\u0627\u0632\u0643 \u0648\u0643\u0648\u0627\u0631\u062B \u0643\u0648\u0646\u064A\u0629\u060C \u062A\u063A\u064A\u0631\u0627\u062A \u0645\u0646\u0627\u062E\u064A\u0629 \u062D\u0627\u062F\u0629 \u0648\u062A\u063A\u064A\u0631 \u062A\u0631\u0643\u064A\u0628 \u0627\u0644\u063A\u0644\u0627\u0641 \u0627\u0644\u062C\u0648\u064A\u060C \u0646\u0634\u0627\u0637 \u0628\u0631\u0643\u0627\u0646\u064A \u0647\u0627\u0626\u0644\u060C \u062A\u063A\u064A\u0631 \u0645\u0633\u062A\u0648\u0649 \u0633\u0637\u062D \u0627\u0644\u0628\u062D\u0631 \u0648\u0634\u0643\u0644 \u0627\u0644\u0642\u0627\u0631\u0627\u062A."]]),_([["Fossil skeletons of primitive whales in Wadi Al-Hitan (Fayoum) show the region was once covered by an ancient sea.","\u0647\u064A\u0627\u0643\u0644 \u0627\u0644\u062D\u064A\u062A\u0627\u0646 \u0627\u0644\u0628\u062F\u0627\u0626\u064A\u0629 \u0627\u0644\u0645\u062A\u062D\u062C\u0631\u0629 \u0641\u064A \u0648\u0627\u062F\u064A \u0627\u0644\u062D\u064A\u062A\u0627\u0646 \u0628\u0627\u0644\u0641\u064A\u0648\u0645 \u062A\u062F\u0644 \u0639\u0644\u0649 \u0623\u0646 \u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0643\u0627\u0646\u062A \u0645\u063A\u0637\u0627\u0629 \u0628\u0628\u062D\u0631 \u0642\u062F\u064A\u0645."],["The Petrified Forest in Cairo shows that the region was a humid forest and the climate changed from humid to dry.","\u0627\u0644\u063A\u0627\u0628\u0629 \u0627\u0644\u0645\u062A\u062D\u062C\u0631\u0629 \u0641\u064A \u0627\u0644\u0642\u0627\u0647\u0631\u0629 \u062A\u062F\u0644 \u0639\u0644\u0649 \u0623\u0646 \u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0643\u0627\u0646\u062A \u063A\u0627\u0628\u0629 \u0631\u0637\u0628\u0629 \u0648\u0623\u0646 \u0627\u0644\u0645\u0646\u0627\u062E \u062A\u063A\u064A\u0631 \u0645\u0646 \u0631\u0637\u0628 \u0625\u0644\u0649 \u062C\u0627\u0641."]]),L(["Evolutionary relationships: palaeontology with anatomy and genetics shows that species branched from common ancestors. The Asian elephant is the closest living relative of the extinct mammoth.","\u0627\u0644\u0639\u0644\u0627\u0642\u0627\u062A \u0627\u0644\u062A\u0637\u0648\u0631\ 7\u0644\u0637\u0628\u064A\u0639\u064A (\u062A\u062F\u0631\u064A\u062C\u064A \u0623\u0648 \u0623\u062D\u064A\u0627\u0646\u0627 \u0633\u0631\u064A\u0639)."],["Accumulated genetic mutations in a class of organisms.","\u062A\u0631\u0627\u0643\u0645 \u0627\u0644\u0637\u0641\u0631\u0627\u062A \u0627\u0644\u062C\u064A\u0646\u064A\u0629 \u0641\u064A \u0637\u0627\u0626\u0641\u0629 \u0645\u0646 \u0627\u0644\u0643\u0627\u0626\u0646\u0627\u062A."],["Geographical isolation: a natural barrier (mountain range, wide river, deep valley) separates a group from the rest of its species.","\u0627\u0644\u0639\u0632\u0644 \u0627\u0644\u062C\u063A\u0631\u0627\u0641\u064A: \u062D\u0627\u062C\u0632 \u0637\u0628\u064A\u0639\u064A (\u0633\u0644\u0633\u0644\u0629 \u062C\u0628\u0627\u0644 \u0623\u0648 \u0646\u0647\u0631 \u0639\u0631\u064A\u0636 \u0623\u0648 \u0648\u0627\u062F\u064D \u0639\u0645\u064A\u0642) \u064A\u0641\u0635\u0644 \u0645\u062C\u0645\u0648\u0639\u0629 \u0639\u0646 \u0628\u0642\u064A\u0629 \u0646\u0648\u0639\u0647\u0627."]]),L(["Steps of new species formation: (1) mating and gene flow between the groups stop; (2) each group accumulates independent mutations; (3) natural selection preserves favourable traits in each; (4) the differences grow until mating becomes impossible, so a new species appears.","\u062E\u0637\u0648\u0627\u062A \u0646\u0634\u0623\u0629 \u0646\u0648\u0639 \u062C\u062F\u064A\u062F: (1) \u064A\u062A\u0648\u0642\u0641 \u0627\u0644\u062A\u0632\u0627\u0648\u062C \u0648\u0627\u0646\u062A\u0642\u0627\u0644 \u0627\u0644\u062C\u064A\u0646\u0627\u062A \u0628\u064A\u0646 \u0627\u0644\u0645\u062C\u0645\u0648\u0639\u062A\u064A\u0646\u061B (2) \u062A\u062A\u0631\u0627\u0643\u0645 \u0641\u064A \u0643\u0644 \u0645\u062C\u0645\u0648\u0639\u0629 \u0637\u0641\u0631\u0627\u062A \u0645\u0633\u062A\u0642\u0644\u0629\u061B (3) \u064A\u062D\u0627\u0641\u0638 \u0627\u0644\u0627\u0646\u062A\u062E\u0627\u0628 \u0627\u0644\u0637\u0628\u064A\u0639\u064A \u0639\u0644\u0649 \u0627\u0644\u063
